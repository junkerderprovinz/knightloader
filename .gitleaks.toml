# Secret scanning for this repository.
#
# The default rule set does the work; this file exists only to carve out the one
# fixture that IS a credential by shape and has to stay that way.
#
# Why a config file and not a `gitleaks:allow` comment at the line: the scanner
# reads COMMITS, so an annotation added afterwards does not reach the commit
# that already carries the line, and the push stays blocked forever. Why not
# `--no-verify`: that switch turns off gofmt and hadolint along with the secret
# scan, so a guard you can only disable wholesale is a guard that gets disabled
# wholesale.

[extend]
useDefault = true

[allowlist]
description = "Invented credentials that are test fixtures for the parsers that read them"
# Scoped to the exact invented pair rather than to the file, so a real secret
# landing in the same test tomorrow is still caught. internal/resolver/hostheaders
# parses a pasted `curl -u user:pass` line, which means the fixture has to look
# exactly like the thing being parsed or the test exercises a parser nobody uses.
#
# The two below are the same shape of exemption, for internal/secret/totp_test.go:
#
#   GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ is RFC 6238's own test seed, the base32 of
#   the ASCII digits "12345678901234567890". It is printed in the RFC, it is in
#   every TOTP implementation's test suite on earth, and the test exists to
#   check this code against the published vectors - substituting a different
#   seed would leave the vectors unverifiable, which is the whole point of
#   having them.
#
#   0123456789abcdef is a sixteen-character counting sequence standing in for an
#   HMAC key. Anything a scanner would not flag would also be less obviously a
#   placeholder to a reader, and that trade goes the wrong way in a file about
#   secrets.
#
# Both are matched as literals rather than by file, so a real key landing in
# that same test tomorrow is still caught.
#
# internal/eventprog/event_test.go hands a program an environment holding
# KL_TORBOX and kl_alldebrid and checks their values never reach it. Those
# values stand for the service keys an instance may be started with, so they
# read like secrets, and they are matched as literals too.
regexes = [
  '''demo:s3cret''',
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''0123456789abcdef''',
  '''KL_TORBOX=secret-key''',
  '''kl_alldebrid=other-secret''',
]
