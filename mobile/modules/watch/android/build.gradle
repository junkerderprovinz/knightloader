plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'design.halleluja.knightloader'
version = '1.0.0'

android {
  namespace "design.halleluja.knightloader.watch"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation "androidx.core:core-ktx:1.17.0"
}
