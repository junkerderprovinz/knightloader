<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1fichier.com: Cloud Storage</title>
</head>
<body>
<div class="bloc2">
<table class="premium">
<tr><td class="normal" style="width:120px">File name :</td><td class="normal"><span style="font-weight:bold">{{.Name}}</span></td></tr>
<tr><td class="normal">Date :</td><td class="normal">05/11/2026 21:14</td></tr>
<tr><td class="normal">Size :</td><td class="normal"><span style="font-size:1.1em">{{.Size}}</span></td></tr>
</table>
{{if .Countdown}}<div class="ct_warn">Free download in ⏳ {{.Countdown}}</div>
{{end}}<form action="{{.Action}}" method="post">
<input type="hidden" name="adz" value="2.0.1">
{{if .Password}}<p>This file is protected by a password.</p>
<input type="password" name="pass" id="pass" value="">
{{end}}<input type="checkbox" name="dl_no_ssl" id="dl_no_ssl"> <label for="dl_no_ssl">Download without SSL</label>
<input type="submit" id="dlb" name="save" value="Free download" class="ok btn-general btn-orange">
</form>
<form action="https://1fichier.com/console/abo.pl" method="get">
<input type="hidden" name="from" value="dl">
<input type="submit" value="Premium">
</form>
</div>
</body>
</html>
