<!DOCTYPE html>
<html>
<head>
    <Title>FileSpace - Login</Title>
</head>
<body>
         <li><a href="/login.html">Login</a>&nbsp; &nbsp;</li>
{{if .Refused}}<span class="red">Incorrect Login or Password</span>
{{end}}                            <form class="form-horizontal" action="/"
                                  name="FL">
                                <input name="op" value="login" type="hidden">
                                <input name="redirect" value="/" type="hidden">

                                <div class="form-group" style="margin-bottom:10px;">
                                    <input class="form-control input-large" id="login" name="login"
                                           placeholder="Username" type="text">
                                </div>

                                <div class="form-group">
                                    <input name="password" class="form-control input-large" id="inputPassword"
                                           placeholder="Password" type="password">
                                </div>

                                <span class="red"></span>
                                <div class="help-block">
                                    <input value="Login" class="btn btn-large btn-info btn_blue"
                                           style="height:58px;margin-left:-15px;margin-top:15px;" type="submit">
                                </div>

                            </form>
</body>
</html>
