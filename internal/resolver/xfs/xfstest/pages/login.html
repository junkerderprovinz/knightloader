<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Login</title>
</head>
<body>
<a href="/login.html">Login</a>
{{if .Refused}}<div class="err">Incorrect Login or Password</div>
{{end}}{{if .WrongCaptcha}}<div class="err">Wrong captcha</div>
{{end}}<form method="POST" action="{{.Action}}" name="FL">
<input type="hidden" name="op" value="login">
<input type="hidden" name="token" value="579fb19833d7df1bb74d8f65080e00fd">
<input type="hidden" name="rand" value="">
<input type="hidden" name="redirect" value="">
<input type="text" name="login" value="" class="form-control">
<input type="password" name="password" class="form-control">
{{if .SiteKey}}<div class="cf-turnstile" data-sitekey="{{.SiteKey}}"></div>
{{end}}<input type="submit" value="Submit">
</form>
</body>
</html>
