id: io.github.junkerderprovinz.knightloader
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: knightloader
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
modules:
  - name: knightloader
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOTOOLCHAIN: local
        GOFLAGS: -modcacherw
        GOPROXY: file:///run/build/knightloader/gomod
        GOSUMDB: 'off'
        GOMODCACHE: /run/build/knightloader/gomodcache
        GOCACHE: /run/build/knightloader/gocache
        CGO_ENABLED: '1'
    build-commands:
      - npm --prefix web ci --offline --no-audit --no-fund --cache=$FLATPAK_BUILDER_BUILDDIR/flatpak-node/npm-cache
      - npm --prefix web run build
      # The Updates card shows the newest release in the metainfo.
      - >-
        version=$(sed -n 's|.*<release version="\([^"]*\)".*|\1|p' flatpak/$FLATPAK_ID.metainfo.xml | head -1);
        cd desktop && go build -tags production,gtk3 -trimpath -buildvcs=false
        -ldflags "-s -w -X github.com/junkerderprovinz/knightloader/internal/buildinfo.Version=v$version"
        -o knightloader .
      - install -Dm755 desktop/knightloader $FLATPAK_DEST/bin/knightloader
      - install -Dm644 flatpak/$FLATPAK_ID.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 flatpak/$FLATPAK_ID.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      # logo.svg is not square, and Flatpak exports square icons only.
      - install -Dm644 desktop/installer/icon.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -Dm644 LICENSE $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - web/node_modules
          - mobile/node_modules
          - flatpak/.state
          - flatpak/.build
          - flatpak/.repo
      - go-sources.json
      - node-sources.json
