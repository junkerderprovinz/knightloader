<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="glimstone.css" />
    <link rel="stylesheet" href="flags.css" />
    <style>
      body {
        margin: 0;
        /* 720, up from 560 (jdp, 2026-08-28: "Können wir die cards etwas
           breiter machen?"). This is a full browser tab, not a popup, and at
           560 the colour rows had the label at one edge and eight swatches
           crowding the other with nothing between them. Wider is also what
           lets a colour row keep its label, its swatches and its reset badge
           on one line. */
        max-width: 720px;
        padding: 28px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: var(--text-body);
        line-height: 1.5;
      }
      h1 { font-size: 18px; margin: 0 0 6px; color: var(--accent); }
      /* The cards carry the rhythm now. 26px between them is enough that the
         badge overhanging each top edge never crowds the card above it. */
      section.glim-card + section.glim-card { margin-top: 26px; }
      section.glim-card:first-of-type { margin-top: 22px; }
      h2 { margin: 0; font-size: var(--text-caption); font-weight: 500; }
      label { display: block; font-size: var(--text-dense); color: var(--carbon-text-sub); margin-bottom: 6px; }
      /* Selects are shaped like the inputs deliberately: a native dropdown
         standing next to a token-styled field reads as another app's control.
         Both now match the web UI's own field exactly (ui.tsx's inputClass),
         which is a FILLED surface and no border at all (jdp, 2026-08-27: "Das
         Sprachdropdown ist in der Erweiterung nicht im GSS") - GlimStone
         separates with surface steps, never with lines, and this sheet had
         kept a 1px border plus a focus outline from before it followed that
         rule. surface2 is the field colour; the focus ring is a box-shadow,
         because an outline sits outside the radius and squares off the
         corner it is drawn around. */
      input,
      select {
        box-sizing: border-box;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        outline: none;
        transition: box-shadow 150ms ease;
      }
      input:focus,
      select:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
      /* The "Report it" link has to be the same object as the button beside it,
         so the look lives here once and the anchor is only told to be a box. */
      button,
      a.btnlike {
        padding: 9px 16px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--accent);
        color: var(--accent-contrast);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      a.btnlike {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      button.secondary,
      a.btnlike.secondary {
        background: var(--carbon-surface2);
        color: var(--carbon-text);
      }
      button.danger {
        background: transparent;
        color: var(--status-fail-text);
        padding: 6px 10px;
      }
      /* Inside a card the list has the card's own padding around it already. */
      #list:not(:empty) { margin-bottom: 2px; }
      #status { margin-top: 10px; font-size: var(--text-dense); min-height: 1.2em; }
      .ok { color: var(--status-ok-text); }
      /* 16, and the refresh button below it sits 16 away too - the same
         correction popup.html's own #instanceList just had. jdp reported the
         popup ("Die abstaände zwischen den instanzen-cards und des buttons
         darunter sind unterschiedlich"); this page draws the same cards with
         the same defect, 8 between them and 12 under them, and fixing only
         the page he happened to be looking at is how the two drift apart. */
      #list { display: flex; flex-direction: column; gap: 16px; }
      .empty { color: var(--carbon-text-muted); font-size: var(--text-body); padding: 8px 0; }
      .fields { display: flex; gap: 8px; }
      /* The join form: the phrase field on its own line above its buttons.
         Twelve words do not fit beside a button at any window width worth
         designing for. */
      #joinForm { display: flex; flex-direction: column; gap: 10px; margin: 0; }
      #phrase { width: 100%; }
      #refreshGroup { margin-top: 16px; }
      #refreshGroup:disabled { opacity: 0.55; cursor: default; }
      /* The info glyph sits INSIDE the heading badge, so it takes the badge's
         own ink rather than the muted page colour it defaults to. */
      .glim-section-badge .glim-info-icon { color: currentColor; }
      /* Three settings that differ only in what they set, stacked in one column
         so the eye compares the answers instead of the layout. The label rule
         above would otherwise shrink the selects along with their captions. */
      .axes { display: flex; flex-direction: column; gap: 14px; }
      pre.report {
        margin: 0 0 10px;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: var(--text-dense);
        color: var(--carbon-text-sub);
      }
    </style>
  </head>
  <body>
    <h1>KnightLoader</h1>

    <!-- No prose under any of these headings. Every explanation is an info
         bubble on the heading badge itself, set by options.js so it follows the
         chosen language (jdp, 2026-08-28: "Alle infotexte in i infobubbles!").
         The rule is in the GlimStone guide, which also names the excuse this
         page used to run on: a surface with no component framework is not an
         exemption, because a bubble is markup plus CSS. -->

    <section class="glim-card">
      <h2 class="glim-section-badge" id="groupHeading">Group</h2>
      <form id="joinForm">
        <!-- Masked, with the eye inside the field (jdp, 2026-08-28: "Die
             Phrase wird offen angezeigt in der erweiterung"). Twelve words
             open every instance in the group, which makes them a credential
             and not a setting - and an options page is exactly the surface
             somebody opens while a colleague is looking at the screen. -->
        <label class="glim-secret">
          <input
            id="phrase"
            type="password"
            placeholder="twelve words, separated by spaces"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="phraseEye" class="glim-eye" type="button"></button>
        </label>
        <div class="fields">
          <button id="join" type="submit">Connect</button>
          <button id="leave" class="danger" type="button" hidden>Leave the group</button>
        </div>
      </form>
      <div id="status"></div>
      <div id="list"></div>
      <button id="refreshGroup" class="secondary" type="button" hidden>Refresh</button>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="languageHeading">Language</h2>
      <!-- A listbox, not a native select: an <option> can hold plain text and
           nothing else, so a flag beside a language name is impossible in one,
           and a native dropdown among token-styled controls reads as another
           application's widget. Built by options.js. -->
      <div class="glim-listbox" id="languageBox"></div>
    </section>

    <!-- One card per axis (jdp, 2026-08-28: "Können wir die aussehen card
         aufsplitten?"), which is also how KnightLoader's own Look page is
         built: Corners, Colours and Theme are three cards there, not three
         rows of one. The card heading carries the explanation as its bubble,
         so a split costs no prose. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="appearanceHeading">Look</h2>
      <!-- Take the look from the instance instead of choosing it here. It
           reads GET /api/appearance, which is on the list a group member may
           reach through the relay - so it costs no permission at all. First,
           because it decides whether the three cards below it are yours to
           set at all. -->
      <div class="glim-row">
        <span class="glim-row-label" id="followInstanceLabel"></span>
        <button type="button" role="switch" aria-checked="false" id="followInstance" class="glim-switch">
          <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
        </button>
      </div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="themeHeading">Theme</h2>
      <div class="glim-seg" id="themeSeg" role="group"></div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="shapeHeading">Corners</h2>
      <div class="glim-seg" id="shapeSeg" role="group"></div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="coloursHeading">Colours</h2>
      <div class="axes">
        <!-- Label left, everything clickable right, exactly as the web UI's
             own Colours card lays it out. The current colour opens the page's
             own picker; the eight presets are the shortcut; the reset badge
             appears only once the accent has actually moved. -->
        <div class="glim-axis glim-axis--colours">
          <span class="glim-axis-label" id="accentLabel">Accent</span>
          <button type="button" class="glim-accent-now" id="accentNow"></button>
          <div class="glim-swatches" id="accentSwatches"></div>
        </div>
        <!-- The rainbow: the accent in the plural. The same three switches and
             the same palette the web UI's Look page offers, in the same order,
             so somebody who set this up there recognises it here. -->
        <div class="glim-row" id="rainbowRow">
          <span class="glim-row-label" id="rainbowLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowOn" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-row" id="rainbowReactiveRow">
          <span class="glim-row-label" id="rainbowReactiveLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowReactive" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-row" id="rainbowRotateRow">
          <span class="glim-row-label" id="rainbowRotateLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowRotate" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-axis glim-axis--colours" id="paletteRow">
          <span class="glim-axis-label" id="paletteLabel">Palette</span>
          <div class="glim-swatches" id="paletteSwatches"></div>
        </div>
      </div>
    </section>

    <!-- On from the first second: it is the reason most people install this,
         and the manifest declares the site access it needs, so there is no
         later prompt for a switch to be waiting on. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="cnlHeading">Click'n'Load</h2>
      <button type="button" role="switch" aria-checked="false" id="cnlEnabled" class="glim-switch">
        <span class="glim-switch-label" id="cnlToggle"></span>
        <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
      </button>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="problemsHeading">Problems?</h2>
      <pre id="report" class="report glim-well glim-num"></pre>
      <div class="fields">
        <button id="copyReport" class="secondary" type="button">Copy report</button>
        <a id="reportLink" class="secondary btnlike" target="_blank" rel="noreferrer noopener">Report it</a>
      </div>
    </section>

    <!-- Appearance first: the look is put on <html> before anything is
         drawn, so no page is ever painted in one look and repainted in
         another. -->
    <script src="appearance.js"></script>
    <script src="colorpicker.js"></script>
    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="tooltip.js"></script>
    <script src="options.js"></script>
  </body>
</html>
