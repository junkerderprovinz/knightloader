<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="glimstone.css" />
    <link rel="stylesheet" href="flags.css" />
    <style>
      body {
        margin: 0;
        /* 720, up from 560 (jdp, 2026-08-28: "Können wir die cards etwas
           breiter machen?"). This is a full browser tab, not a popup, and at
           560 the colour rows had the label at one edge and eight swatches
           crowding the other with nothing between them. Wider is also what
           lets a colour row keep its label, its swatches and its reset badge
           on one line. */
        max-width: 720px;
        padding: 28px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: var(--text-body);
        line-height: 1.5;
      }
      /* An id or class rule that sets `display` OUTRANKS the browser's own
         `[hidden] { display: none }`, so an element with the attribute stays on
         screen and nothing in the markup says why. It bit two controls on this
         page and one in the popup at the same time - #leave is `hidden` in the
         HTML and `.iconBadge` sets `display: inline-flex`, so the bin next to
         Connect was visible with no group to leave; the popup's own collector
         was `hidden` under `#collector { display: flex }` and therefore always
         open (jdp, 2026-08-31: "solange keine Instanz hinzugefügt wurde soll der
         linksammler ausgeblendet sein").
         One rule, first, with !important, because that is the only weight that
         beats an arbitrary future id selector - and the attribute has to mean
         what it says on every page in this family, not on the ones somebody
         remembered. */
      [hidden] { display: none !important; }
      /* The cards carry the rhythm, and the number has to be read against the
         BADGE, not against the card (jdp, 2026-09-01: "In der erweiterung sind
         alle abschnitte zu eng beieinander").
         26 looked generous in the stylesheet and did not on the page: the
         section badge hangs 11px above its own card's top edge, so 26 of margin
         is 15 of actual daylight between one card's bottom and the next card's
         label. 38 puts that back at the 26 the rule always meant.

         The FIRST card gets none of it. There is no page heading any more (jdp,
         2026-09-02: "in den einstellungen die überschrift weg") - the tab strip
         already says KnightLoader and every card names itself with its own
         badge - so the top margin has nothing left to separate the first card
         FROM, and the body's own 28px of padding is the whole gap. Left at 26
         or 38 it would read as the heading's empty seat rather than as spacing.

         Two selectors, because :first-of-type is #pinHint, which is `hidden`
         (and therefore display:none) whenever the toolbar button is pinned,
         which is the normal case: in that state the first card the reader
         actually SEES is the next one, and it would otherwise take the 38px
         sibling rule above. The second selector is (0,3,2) against that rule's
         (0,2,2), so it wins on specificity whatever the source order. It is
         exact for exactly one conditionally hidden card at the top of the page:
         a second one added above Group has to be added here too. */
      section.glim-card + section.glim-card { margin-top: 38px; }
      section.glim-card:first-of-type { margin-top: 0; }
      section.glim-card[hidden] + section.glim-card { margin-top: 0; }
      h2 { margin: 0; font-size: var(--text-caption); font-weight: 500; }
      label { display: block; font-size: var(--text-dense); color: var(--carbon-text-sub); margin-bottom: 6px; }
      /* Selects are shaped like the inputs deliberately: a native dropdown
         standing next to a token-styled field reads as another app's control.
         Both now match the web UI's own field exactly (ui.tsx's inputClass),
         which is a FILLED surface and no border at all (jdp, 2026-08-27: "Das
         Sprachdropdown ist in der Erweiterung nicht im GSS") - GlimStone
         separates with surface steps, never with lines, and this sheet had
         kept a 1px border plus a focus outline from before it followed that
         rule. surface2 is the field colour; the focus ring is a box-shadow,
         because an outline sits outside the radius and squares off the
         corner it is drawn around. */
      input,
      select {
        box-sizing: border-box;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        outline: none;
        transition: box-shadow 150ms ease;
      }
      input:focus,
      select:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
      /* The "Report it" link has to be the same object as the button beside it,
         so the look lives here once and the anchor is only told to be a box. */
      /* 36px, the same height the square icon badges are (jdp, 2026-08-30:
         "der NEu verbinden button ist zu hoch, soll gleich hoch sein wie der
         löschen button"). It was 9px of padding plus the body line-height,
         which lands around 40 - close enough to look like a mistake rather
         than a decision, and visibly wrong the moment a text button and a
         badge stand in the same row. One height for every pressable thing on
         this page: the size system decides, not each control's own padding. */
      button,
      a.btnlike {
        box-sizing: border-box;
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--accent);
        color: var(--accent-contrast);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      a.btnlike { text-decoration: none; }
      /* The glyph needs air between itself and the word (jdp, 2026-09-01: "die
         glyphen der buttons sind zu nah am text"). An inline-flex row with no
         gap sets an icon hard against the first letter, which reads as one
         smudged shape rather than a mark and a label. 8 is the same step the
         rest of this page uses between a control and its neighbour.
         BOTH elements, not just the anchor: the report button is a real
         <button> and now carries a glyph too, and a <button> is not a flex
         container by default, so `gap` alone would have done nothing there. */
      button,
      a.btnlike {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      button > svg,
      a.btnlike > svg { flex: 0 0 auto; }
      button.secondary,
      a.btnlike.secondary {
        background: var(--carbon-surface2);
        color: var(--carbon-text);
      }
      /* Inside a card the list has the card's own padding around it already. */
      #list:not(:empty) { margin-bottom: 2px; }
      #status { margin-top: 10px; font-size: var(--text-dense); min-height: 1.2em; }
      .ok { color: var(--status-ok-text); }
      /* 16, and the refresh button below it sits 16 away too - the same
         correction popup.html's own #instanceList just had. jdp reported the
         popup ("Die abstaände zwischen den instanzen-cards und des buttons
         darunter sind unterschiedlich"); this page draws the same cards with
         the same defect, 8 between them and 12 under them, and fixing only
         the page he happened to be looking at is how the two drift apart. */
      #list { display: flex; flex-direction: column; gap: 16px; }
      .empty { color: var(--carbon-text-muted); font-size: var(--text-body); padding: 8px 0; }
      .fields { display: flex; gap: 8px; }
      /* The join form: the phrase field on its own line above its buttons.
         Twelve words do not fit beside a button at any window width worth
         designing for. */
      #joinForm { display: flex; flex-direction: column; gap: 10px; margin: 0; }
      #phrase { width: 100%; }
      #refreshGroup { margin-top: 16px; }
      #refreshGroup:disabled { opacity: 0.55; cursor: default; }
      /* The info glyph sits INSIDE the heading badge, so it takes the badge's
         own ink rather than the muted page colour it defaults to. */
      .glim-section-badge .glim-info-icon { color: currentColor; }
      /* Three settings that differ only in what they set, stacked in one column
         so the eye compares the answers instead of the layout. The label rule
         above would otherwise shrink the selects along with their captions. */
      .axes { display: flex; flex-direction: column; gap: 12px; }
      /* Two spacings were being applied to the same gap: the column's own 14px
         gap AND .glim-row's 14px margin-top, which lands at 28 between Accent,
         Rainbow, Reactive, Rotation and Palette (jdp, 2026-08-31: "Die zeilen
         wie Akzentfarbe, Regenbogenmodus, etc sind zu weit auseinander"). A
         flex gap and a child margin do not merge the way two vertical margins
         collapse - they add. Inside a gapped column the row keeps no margin of
         its own; outside one it still needs it, so the rule is scoped rather
         than the margin deleted. */
      .axes > .glim-row { margin-top: 0; }
      /* The square icon badge, the same object popup.html draws in its own
         header: one size for every one of them, no drawn border, and the ink
         is the ordinary badge ink rather than a colour of its own. */
      .iconBadge {
        display: inline-flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text-sub);
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }
      .iconBadge:hover { background: var(--carbon-surface3); color: var(--carbon-text); }
      .iconBadge:active { transform: scale(0.97); }
      /* Label left, control right - the row shape every setting in this family
         uses, and the one the app's own settings just adopted. */
      .glim-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
      .glim-row-label { font-size: var(--text-body); color: var(--carbon-text); }
      .glim-row-control { display: flex; align-items: center; gap: 8px; }
      .glim-row-unit { font-size: var(--text-dense); color: var(--carbon-text-muted); }
      /* The browser's own spinner is dropped, not styled (jdp, 2026-08-30: "die
         beiden pfeiltasten im countdown eisntellungsfeld haben einen dunklen
         hintergrund und der text ist zu nah an diesen pfeilen").

         It cannot be made to follow the language: Chrome paints those two
         arrows from the OS widget set, on their own background, and the only
         property that reaches them is `accent-color` - which recolours part of
         a control whose geometry, ground and spacing still ignore every token
         here. That is the same reasoning the design language already applies
         to the native checkbox, and it lands the same way: the native widget
         goes.

         appearance:none in the standard property AND the -moz/-webkit ones,
         because Firefox draws its spinner through a different pseudo-element
         than Chrome, and a rule that only names the WebKit one leaves Firefox
         with the arrows still there. Typing and the arrow keys are untouched -
         it is still <input type="number">, so min/max/step and the numeric
         keypad on a phone all stay. */
      /* The arrows sit INSIDE the field, where the browser's own put them, and
         carry no ground of their own (jdp, 2026-08-31: "sie sollen im
         eingabefeld sein wie ursprünglich aber keinen zusätzlichen dunklen
         hintergrund").

         The 1.13.0 version put them beside the field as two filled squares,
         which turned one control into three objects standing in a row - and
         the whole complaint about the native spinner was never "there are
         arrows", it was "they arrive on their own dark background". Copying
         that ground onto our own arrows reproduced the defect in our tokens
         instead of the OS's. A stepper is part of the field, so it takes the
         field's own surface and only its INK changes on hover.

         The field carries the padding for them, so the digits never run
         underneath. */
      .numberField { position: relative; display: inline-flex; align-items: center; }
      #cnlCountdown {
        width: 84px;
        padding-inline-end: 26px;
        text-align: center;
        appearance: textfield;
        -moz-appearance: textfield;
      }
      #cnlCountdown::-webkit-outer-spin-button,
      #cnlCountdown::-webkit-inner-spin-button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
      }
      .steppers {
        position: absolute;
        inset-inline-end: 6px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 13px;
        padding: 0;
        border: 0;
        border-radius: 0;
        /* No ground at all: it is part of the field it sits in. */
        background: none;
        color: var(--carbon-text-muted);
        cursor: pointer;
        transition: color 150ms ease;
      }
      .stepper svg { display: block; }
      .stepper:hover { background: none; color: var(--carbon-text); }
      /* At the end of the range there is nothing to step to, and a control that
         looks pressable and does nothing is worse than one that says so. */
      .stepper:disabled { opacity: 0.35; cursor: default; }
      .stepper:disabled:hover { color: var(--carbon-text-muted); }
      /* The About card's own two kinds of line. The sentences read as body text
         because they ARE the card's content; the versions close the card,
         quieter, because they are the thing you look up rather than the thing
         you read. */
      .aboutText { margin: 0 0 8px; font-size: var(--text-body); color: var(--carbon-text-sub); }
      /* Each offer in the About card is a sentence with its button under it, and
         the two have to sit closer to each other than to the next offer or all
         three read as one list (jdp, 2026-09-01: "alle abschnitte zu eng
         beieinander"). 20 after a button row, 8 under its own sentence: the
         grouping is done by the spacing, which is the only thing doing it here
         since the card draws no lines between them. */
      .glim-card .fields + .aboutText { margin-top: 20px; }
      .aboutVersions {
        margin: 0;
        font-size: var(--text-dense);
        color: var(--carbon-text-muted);
        font-variant-numeric: tabular-nums;
      }
      /* It closes the card now, so it takes the same 20 after a button row that
         a new sentence takes, and no bottom margin of its own: the card's own
         padding is the space under the last line. */
      .glim-card .fields + .aboutVersions { margin-top: 20px; }
      /* Underlined only on hover: a line under every version number turns a
         quiet fact into two links shouting at each other. It still has to LOOK
         reachable, so it takes the accent ink. */
      .versionLink { color: var(--accent-ink); text-decoration: none; }
      .versionLink:hover { text-decoration: underline; }
      pre.report {
        margin: 0 0 10px;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: var(--text-dense);
        color: var(--carbon-text-sub);
      }
    </style>
  </head>
  <body>
    <!-- Shown only when the browser itself says the toolbar button is hidden -
         see background.js's nichtInDerLeiste. It is the answer to the one
         sentence jdp repeated three evenings running ("es kommt die meldung
         erweiterung geladen aber es zeigt sie nicht an"): the extension was
         installed every time and Chromium had put it behind the puzzle piece,
         which looks exactly like a failed install and says nothing. -->
    <section class="glim-card pinHint" id="pinHint" hidden>
      <h2 class="glim-section-badge" id="pinHeading">Almost there</h2>
      <p id="pinBody" class="aboutText"></p>
      <div class="fields">
        <button id="pinDismiss" class="secondary" type="button"></button>
      </div>
    </section>

    <!-- No prose under any of these headings. Every explanation is an info
         bubble on the heading badge itself, set by options.js so it follows the
         chosen language (jdp, 2026-08-28: "Alle infotexte in i infobubbles!").
         The rule is in the GlimStone guide, which also names the excuse this
         page used to run on: a surface with no component framework is not an
         exemption, because a bubble is markup plus CSS. -->

    <section class="glim-card">
      <h2 class="glim-section-badge" id="groupHeading">Group</h2>
      <form id="joinForm">
        <!-- Masked, with the eye inside the field (jdp, 2026-08-28: "Die
             Phrase wird offen angezeigt in der erweiterung"). Twelve words
             open every instance in the group, which makes them a credential
             and not a setting - and an options page is exactly the surface
             somebody opens while a colleague is looking at the screen. -->
        <!-- Two controls inside the field, in the order the hands move: paste
             first, then check what landed. Twelve words arrive from somewhere
             else by definition - the WebUI generated them and the phone
             already has this button - so the extension was the one surface
             that made people retype a credential or hunt for Ctrl+V in a
             field they had not focused yet. -->
        <label class="glim-secret glim-secret--two">
          <input
            id="phrase"
            type="password"
            placeholder="twelve words, separated by spaces"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="phrasePaste" class="glim-eye glim-eye--second" type="button"></button>
          <button id="phraseEye" class="glim-eye" type="button"></button>
        </label>
        <div class="fields">
          <button id="join" type="submit">Connect</button>
          <!-- [281] A square badge with a filled bin, not a red word (jdp,
               2026-08-30: "Gruppe verlassen soll ein quadratischer button mit
               solidem mülleimer icon sien"). Same size and same treatment as
               every other icon badge in the family - a delete control is not
               styled apart from its neighbours, its meaning is carried by its
               glyph and by the confirmation behind it. The name survives as the
               accessible name and the tooltip. -->
          <button id="leave" class="iconBadge" type="button" hidden></button>
        </div>
      </form>
      <div id="status"></div>
      <div id="list"></div>
      <button id="refreshGroup" class="secondary" type="button" hidden>Refresh</button>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="languageHeading">Language</h2>
      <!-- A listbox, not a native select: an <option> can hold plain text and
           nothing else, so a flag beside a language name is impossible in one,
           and a native dropdown among token-styled controls reads as another
           application's widget. Built by options.js. -->
      <div class="glim-listbox" id="languageBox"></div>
    </section>

    <!-- One card per axis (jdp, 2026-08-28: "Können wir die aussehen card
         aufsplitten?"), which is also how KnightLoader's own Look page is
         built: Corners, Colours and Theme are three cards there, not three
         rows of one. The card heading carries the explanation as its bubble,
         so a split costs no prose. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="appearanceHeading">Look</h2>
      <!-- Take the look from the instance instead of choosing it here. It
           reads GET /api/appearance, which is on the list a group member may
           reach through the relay - so it costs no permission at all. First,
           because it decides whether the three cards below it are yours to
           set at all. -->
      <div class="glim-row">
        <span class="glim-row-label" id="followInstanceLabel"></span>
        <button type="button" role="switch" aria-checked="false" id="followInstance" class="glim-switch">
          <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
        </button>
      </div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="themeHeading">Theme</h2>
      <div class="glim-seg" id="themeSeg" role="group"></div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="shapeHeading">Corners</h2>
      <div class="glim-seg" id="shapeSeg" role="group"></div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="coloursHeading">Colours</h2>
      <div class="axes">
        <!-- Label left, everything clickable right, exactly as the web UI's
             own Colours card lays it out. The current colour opens the page's
             own picker; the eight presets are the shortcut; the reset badge
             appears only once the accent has actually moved. -->
        <!-- The picker button lives INSIDE the swatch row now, at its end, next
             to the reset badge: "pick any colour" and "back to the default" are
             the two ways out of the eight presets, and they belong together.
             options.js moves it there and puts a glyph on it, so it is no
             longer a ninth circle nobody could tell was a button. -->
        <div class="glim-axis glim-axis--colours">
          <span class="glim-axis-label" id="accentLabel">Accent</span>
          <div class="glim-swatches" id="accentSwatches"></div>
        </div>
        <!-- The rainbow: the accent in the plural. The same three switches and
             the same palette the web UI's Look page offers, in the same order,
             so somebody who set this up there recognises it here. -->
        <div class="glim-row" id="rainbowRow">
          <span class="glim-row-label" id="rainbowLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowOn" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-row" id="rainbowReactiveRow">
          <span class="glim-row-label" id="rainbowReactiveLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowReactive" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-row" id="rainbowRotateRow">
          <span class="glim-row-label" id="rainbowRotateLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowRotate" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-axis glim-axis--colours" id="paletteRow">
          <span class="glim-axis-label" id="paletteLabel">Palette</span>
          <div class="glim-swatches" id="paletteSwatches"></div>
        </div>
      </div>
    </section>

    <!-- On from the first second: it is the reason most people install this,
         and the manifest declares the site access it needs, so there is no
         later prompt for a switch to be waiting on. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="cnlHeading">Click'n'Load</h2>
      <button type="button" role="switch" aria-checked="false" id="cnlEnabled" class="glim-switch">
        <span class="glim-switch-label" id="cnlToggle"></span>
        <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
      </button>
      <!-- How long a caught batch waits before it sends itself. The row shape
           is the label-left, control-right one every other setting here uses;
           the explanation hangs off the heading badge's own bubble, like all
           of them. -->
      <div class="glim-row" id="cnlCountdownRow">
        <span class="glim-row-label" id="cnlCountdownLabel"></span>
        <span class="glim-row-control">
          <span class="numberField">
            <input id="cnlCountdown" type="number" min="0" max="60" step="1" inputmode="numeric" />
            <span class="steppers">
              <!-- Drawn, not typed. A font's own ▲ is a sharp glyph at whatever
                   weight the family happens to give it; GlimStone 1.6.0 asks for
                   a solid triangle with ROUNDED corners, done with a matched
                   stroke and stroke-linejoin rather than arcs in the path, and
                   the base path inset by the stroke's half-width so the painted
                   shape lands where the sharp one did instead of growing. -->
              <button type="button" class="stepper" id="cnlCountdownUp">
                <svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
                  <path d="M5 1.7 L8.6 4.6 L1.4 4.6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                </svg>
              </button>
              <button type="button" class="stepper" id="cnlCountdownDown">
                <svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
                  <path d="M5 4.3 L1.4 1.4 L8.6 1.4 Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                </svg>
              </button>
            </span>
          </span>
          <span class="glim-row-unit" id="cnlCountdownUnit"></span>
        </span>
      </div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="problemsHeading">Problems?</h2>
      <pre id="report" class="report glim-well glim-num"></pre>
      <!-- Copy only (jdp, 2026-08-31: "In der Probleme-card den Problem melden
           button weg. auch in der App"). The About card below now carries both
           routes to reporting, and a third door here - one that prefills a
           GitHub form - made this card a second, differently-shaped answer to a
           question the About card answers once. What this card is FOR is the
           report itself: copy it, then use whichever route you prefer. -->
      <div class="fields">
        <button id="copyReport" class="secondary" type="button">Copy report</button>
      </div>
    </section>

    <!-- The About card (jdp, 2026-08-31: "in der App und der Erweiterung und im
         KL soll eine neue Card rein ... darin sollen die versionsnummern stehen
         und ein text ... Die vversionsnummer sollen dann nicht nochmal unter
         den card im hintergrund angeziegt werden").

         It replaces the quiet centred version line that used to sit under the
         last card. That line was the design language's own answer for a while,
         and it had a real weakness: it is page chrome, so it looks like a
         footer nobody put there on purpose, and there is nowhere to hang the
         one thing somebody reading a version number usually wants next, which
         is how to report what they found. A card can carry both.

         This is also the ONE card in the family whose body is prose rather than
         an info bubble - it has no control to explain, the sentence IS the
         content. Written down as such in GlimStone 1.7.0 rather than left as a
         quiet exception somebody else has to guess at. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="aboutHeading">About</h2>
      <!-- Three sentences, each with the thing it asks for directly beneath
           it (jdp, 2026-09-01). The order is his: what this is, then the
           coffee, then the way to report something. A sentence with its own
           button under it reads as one offer; three sentences stacked over one
           row of buttons reads as a form. -->
      <p id="aboutText" class="aboutText"></p>
      <p id="aboutCoffee" class="aboutText"></p>
      <div class="fields">
        <a id="aboutCoffeeBtn" class="secondary btnlike" target="_blank" rel="noreferrer noopener"></a>
      </div>
      <p id="aboutReport" class="aboutText"></p>
      <div class="fields">
        <a id="aboutGithub" class="secondary btnlike" target="_blank" rel="noreferrer noopener"></a>
        <a id="aboutMail" class="secondary btnlike"></a>
      </div>
      <!-- Last line in the card, under the buttons (jdp, 2026-09-05), same as
           the web interface and the app. It reads as a footer, which is what it
           is: each sentence above has its button directly under it, and a build
           number between the body and the coffee line cut that pairing in
           half. -->
      <p id="aboutVersions" class="aboutVersions glim-num"></p>
    </section>
