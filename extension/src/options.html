<!doctype html>
<!-- The values before the language is known; i18n.js replaces them before any
     text is written. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="glimstone.css" />
    <link rel="stylesheet" href="flags.css" />
    <style>
      body {
        margin: 0;
        /* Wide enough for a colour row's label, swatches and reset badge on
           one line. */
        max-width: 720px;
        padding: 28px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        /* The web interface's stack. system-ui lets the browser fall back per
           character for Chinese, Japanese and Korean. */
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: var(--text-body);
        line-height: 1.5;
      }
      /* An id or class rule that sets `display` outranks the browser's own
         `[hidden] { display: none }`, so the attribute gets the weight to win. */
      [hidden] { display: none !important; }
      /* 40px between stacked cards, the shared number. The first visible card
         gets none: #pinHint comes first and is usually hidden, so the card
         after a hidden one resets as well. */
      section.glim-card + section.glim-card { margin-top: 40px; }
      section.glim-card:first-of-type { margin-top: 0; }
      section.glim-card[hidden] + section.glim-card { margin-top: 0; }
      h2 { margin: 0; font-size: var(--text-caption); font-weight: 500; }
      label { display: block; font-size: var(--text-dense); color: var(--carbon-text-sub); margin-bottom: 6px; }
      /* Fields match the web UI's (ui.tsx inputClass): a filled surface and no
         border, since GlimStone separates by surface. The focus ring is a
         box-shadow because an outline ignores the radius. */
      input,
      select {
        box-sizing: border-box;
        /* --btn-h, so fields and buttons share one height. */
        height: var(--btn-h);
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        outline: none;
        transition: box-shadow 150ms ease;
      }
      input:focus,
      select:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
      /* Links styled as buttons share the button rules; every pressable thing
         is --btn-h high. */
      button,
      a.btnlike {
        box-sizing: border-box;
        height: var(--btn-h);
        padding: 0 16px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--accent);
        color: var(--accent-contrast);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      a.btnlike { text-decoration: none; }
      /* Space between a glyph and its label. */
      button,
      a.btnlike {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      button > svg,
      a.btnlike > svg { flex: 0 0 auto; }
      button.secondary,
      a.btnlike.secondary {
        background: var(--carbon-surface2);
        color: var(--carbon-text);
      }
      /* Inside a card the list has the card's own padding around it already. */
      #list:not(:empty) { margin-bottom: 2px; }
      #status { margin-top: 10px; font-size: var(--text-dense); min-height: 1.2em; }
      .ok { color: var(--status-ok-text); }
      /* 16 between cards and 16 to the button below, as in the popup. */
      #list { display: flex; flex-direction: column; gap: 16px; }
      .empty { color: var(--carbon-text-muted); font-size: var(--text-body); padding: 8px 0; }
      /* The shared empty state, a muted icon over a muted title. `.empty` above
         is for loading and relay failures. No card of its own inside the Group
         card. */
      .emptyState {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 20px 0 12px;
        color: var(--carbon-text-muted);
        font-size: var(--text-body);
        text-align: center;
      }
      .emptyState svg { opacity: .45; }
      .fields { display: flex; gap: 8px; }
      /* Twelve words need the phrase field on its own line. */
      #joinForm { display: flex; flex-direction: column; gap: 10px; margin: 0; }
      #phrase { width: 100%; }
      #refreshGroup { margin-top: 16px; }
      #refreshGroup:disabled { opacity: 0.55; cursor: default; }
      /* The info glyph inside a heading badge takes the badge's ink. */
      .glim-section-badge .glim-info-icon { color: currentColor; }
      .axes { display: flex; flex-direction: column; gap: 12px; }
      /* The column gap already spaces the rows; a margin would add to it. */
      .axes > .glim-row { margin-top: 0; }
      /* The square icon badge, one size across the extension (--btn-h), as in
         popup.html and on the instance cards. */
      .iconBadge {
        display: inline-flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: var(--btn-h);
        height: var(--btn-h);
        padding: 0;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text-sub);
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }
      .iconBadge:hover { background: var(--carbon-surface3); color: var(--carbon-text); }
      .iconBadge:active { transform: scale(0.97); }
      /* Label left, control right. */
      .glim-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
      .glim-row-label { font-size: var(--text-body); color: var(--carbon-text); }
      .glim-row-control { display: flex; align-items: center; gap: 8px; }
      .glim-row-unit { font-size: var(--text-dense); color: var(--carbon-text-muted); }
      /* The native spinner is removed rather than styled, since Chrome paints it
         from the OS on its own background. Firefox needs its own property. The
         field stays type="number", so min, max, step and the numeric keypad
         remain. Our steppers sit inside the field on its own surface, and the
         padding keeps the digits clear of them. */
      .numberField { position: relative; display: inline-flex; align-items: center; }
      #cnlCountdown {
        width: 84px;
        padding-inline-end: 26px;
        text-align: center;
        appearance: textfield;
        -moz-appearance: textfield;
      }
      #cnlCountdown::-webkit-outer-spin-button,
      #cnlCountdown::-webkit-inner-spin-button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
      }
      .steppers {
        position: absolute;
        inset-inline-end: 6px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 13px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        color: var(--carbon-text-muted);
        cursor: pointer;
        transition: color 150ms ease;
      }
      .stepper svg { display: block; }
      .stepper:hover { background: none; color: var(--carbon-text); }
      .stepper:disabled { opacity: 0.35; cursor: default; }
      .stepper:disabled:hover { color: var(--carbon-text-muted); }
      .aboutText { margin: 0 0 8px; font-size: var(--text-body); color: var(--carbon-text-sub); }
      /* Each sentence sits closer to its own buttons than to the next one. */
      .glim-card .fields + .aboutText { margin-top: 20px; }
      .aboutVersions {
        margin: 0;
        font-size: var(--text-dense);
        color: var(--carbon-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .glim-card .fields + .aboutVersions { margin-top: 20px; }
      /* Underlined only on hover, in the accent ink. */
      .versionLink { color: var(--accent-ink); text-decoration: none; }
      .versionLink:hover { text-decoration: underline; }
      pre.report {
        margin: 0 0 10px;
        padding: 12px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: var(--text-dense);
        color: var(--carbon-text-sub);
      }
    </style>
  </head>
  <body>
    <!-- Shown when Chromium has hidden the new toolbar button behind the puzzle
         piece, which looks like a failed install (notOnToolbar in
         background.js). -->
    <section class="glim-card pinHint" id="pinHint" hidden>
      <h2 class="glim-section-badge" id="pinHeading">Almost there</h2>
      <p id="pinBody" class="aboutText"></p>
      <div class="fields">
        <button id="pinDismiss" class="secondary" type="button"></button>
      </div>
    </section>

    <!-- Explanations are info bubbles on the heading badges, set by options.js
         in the chosen language. -->

    <section class="glim-card">
      <h2 class="glim-section-badge" id="groupHeading">Group</h2>
      <form id="joinForm">
        <!-- The phrase is a credential, so it is masked. Paste comes first,
             then the eye to check what landed. -->
        <label class="glim-secret glim-secret--two">
          <input
            id="phrase"
            type="password"
            placeholder="twelve words, separated by spaces"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="phrasePaste" class="glim-eye glim-eye--second" type="button"></button>
          <button id="phraseEye" class="glim-eye" type="button"></button>
        </label>
        <div class="fields">
          <button id="join" type="submit">Connect</button>
          <!-- A neutral icon badge with a bin; #leaveConfirm asks before
               anything is deleted. It sits at the end of the row like the
               delete badge on every card. -->
          <button id="leave" class="iconBadge" type="button" hidden></button>
        </div>
      </form>
      <div id="status"></div>
      <div id="list"></div>
      <button id="refreshGroup" class="secondary" type="button" hidden>Refresh</button>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="languageHeading">Language</h2>
      <!-- A listbox built by options.js, since an <option> cannot show a
           flag. -->
      <div class="glim-listbox" id="languageBox"></div>
    </section>

    <!-- One card per axis, as on the web UI's Look page. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="appearanceHeading">Look</h2>
      <!-- Takes the look from the instance through GET /api/appearance over
           the relay. It comes first because it decides whether the cards below
           are set here. Without a group the switch is removed and the notice
           below explains why (GlimStone 1.15.0); options.js swaps the two. -->
      <div class="glim-row" id="followInstanceRow">
        <span class="glim-row-label" id="followInstanceLabel"></span>
        <button type="button" role="switch" aria-checked="false" id="followInstance" class="glim-switch">
          <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
        </button>
      </div>
      <!-- Static markup that options.js fills, since innerHTML from a variable
           fails Mozilla's linter. -->
      <div class="glim-unavailable" id="followUnavailable" hidden>
        <span class="glim-unavailable-title" id="followUnavailableTitle"></span>
        <span class="glim-unavailable-reason" id="followUnavailableReason"></span>
      </div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="themeHeading">Theme</h2>
      <div class="glim-seg" id="themeSeg" role="group"></div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="shapeHeading">Corners</h2>
      <div class="glim-seg" id="shapeSeg" role="group"></div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="coloursHeading">Colours</h2>
      <div class="axes">
        <!-- Label left, swatches right, with the reset badge always at the end,
             as on the web UI's Colours card. -->
        <div class="glim-axis glim-axis--colours">
          <span class="glim-axis-label" id="accentLabel">Accent</span>
          <div class="glim-swatches" id="accentSwatches"></div>
        </div>
        <!-- The rainbow, with the web UI's switches in the same order.
             Reactive, rotation and the palette are hidden while the mode is off
             (GlimStone 1.10.0). -->
        <div class="glim-row" id="rainbowRow">
          <span class="glim-row-label" id="rainbowLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowOn" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-row" id="rainbowReactiveRow">
          <span class="glim-row-label" id="rainbowReactiveLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowReactive" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-row" id="rainbowRotateRow">
          <span class="glim-row-label" id="rainbowRotateLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowRotate" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <!-- Disco, hidden until found: five turn-ons of the rainbow in a row.
             options.js shows it while it is on and for as long as this page
             stays open after finding it, never from storage. -->
        <div class="glim-row" id="rainbowDiscoRow" hidden>
          <span class="glim-row-label" id="rainbowDiscoLabel"></span>
          <button type="button" role="switch" aria-checked="false" id="rainbowDisco" class="glim-switch">
            <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
          </button>
        </div>
        <div class="glim-axis glim-axis--colours" id="paletteRow">
          <span class="glim-axis-label" id="paletteLabel">Palette</span>
          <div class="glim-swatches" id="paletteSwatches"></div>
        </div>
      </div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="cnlHeading">Click'n'Load</h2>
      <button type="button" role="switch" aria-checked="false" id="cnlEnabled" class="glim-switch">
        <span class="glim-switch-label" id="cnlToggle"></span>
        <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
      </button>
      <div class="glim-row" id="cnlCountdownRow">
        <span class="glim-row-label" id="cnlCountdownLabel"></span>
        <span class="glim-row-control">
          <span class="numberField">
            <input id="cnlCountdown" type="number" min="0" max="60" step="1" inputmode="numeric" />
            <span class="steppers">
              <!-- Solid triangles with rounded corners (GlimStone 1.6.0) through
                   a matched stroke, the path inset by half the stroke width. -->
              <button type="button" class="stepper" id="cnlCountdownUp">
                <svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
                  <path d="M5 1.7 L8.6 4.6 L1.4 4.6 Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                </svg>
              </button>
              <button type="button" class="stepper" id="cnlCountdownDown">
                <svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">
                  <path d="M5 4.3 L1.4 1.4 L8.6 1.4 Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                </svg>
              </button>
            </span>
          </span>
          <span class="glim-row-unit" id="cnlCountdownUnit"></span>
        </span>
      </div>
    </section>

    <section class="glim-card">
      <h2 class="glim-section-badge" id="problemsHeading">Problems?</h2>
      <pre id="report" class="report glim-well glim-num"></pre>
      <!-- Only a copy button; the About card carries the ways to report. -->
      <div class="fields">
        <button id="copyReport" class="secondary" type="button">Copy report</button>
      </div>
    </section>

    <!-- The About card, the one card whose body is prose (GlimStone 1.7.0).
         Each sentence has its button directly beneath it. -->
    <section class="glim-card">
      <h2 class="glim-section-badge" id="aboutHeading">About</h2>
      <p id="aboutText" class="aboutText"></p>
      <p id="aboutCoffee" class="aboutText"></p>
      <!-- glim-brand-btn and glim-brand-<name> work only as a pair (GlimStone
           1.10.0): the second supplies the brand colours the first uses. The
           hosted pages come first, in the order the family's cards share. -->
      <div class="fields">
        <a id="aboutCoffeeBtn" class="secondary btnlike glim-brand-btn glim-brand-coffee" target="_blank" rel="noreferrer noopener"></a>
        <a id="aboutPaypalBtn" class="secondary btnlike glim-brand-btn glim-brand-paypal" target="_blank" rel="noreferrer noopener"></a>
        <!-- The wallet route last. It opens a window of our own rather than
             somebody else's page, so it is a button. -->
        <button id="aboutCryptoBtn" class="secondary glim-brand-btn glim-brand-bitcoin" type="button"></button>
      </div>
      <p id="aboutReport" class="aboutText"></p>
      <div class="fields">
        <a id="aboutGithub" class="secondary btnlike glim-brand-btn glim-brand-github" target="_blank" rel="noreferrer noopener"></a>
        <!-- Our own button takes the accent tokens; a third party's mark keeps
             its colour. -->
        <a id="aboutMail" class="secondary btnlike glim-brand-btn glim-brand-house"></a>
      </div>
      <!-- The versions close the card, as in the web interface and the app. -->
      <p id="aboutVersions" class="aboutVersions glim-num"></p>
    </section>

    <!-- The confirmation window (GlimStone 1.12.0), static markup that
         options.js fills. No corner X; the backdrop and Escape cancel. The
         button that goes ahead sits at the end (1.14.0), and neither carries a
         status colour: the sentence does the warning. -->
    <div id="leaveConfirm" class="glim-modal-backdrop" hidden>
      <div
        class="glim-card glim-modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="leaveConfirmTitle"
        aria-describedby="leaveConfirmMessage"
      >
        <h2 class="glim-section-badge" id="leaveConfirmTitle"></h2>
        <p class="glim-modal-message" id="leaveConfirmMessage"></p>
        <div class="glim-modal-actions">
          <button id="leaveConfirmCancel" class="secondary" type="button"></button>
          <button id="leaveConfirmCommit" class="secondary" type="button"></button>
        </div>
      </div>
    </div>

    <!-- The crypto window, filled by options.js. The code comes first, since it
         is what the window is opened for; the chain sits directly under the
         address it changes, and the coins follow as tiles. The way out is the
         button in the bottom row, with no corner X. -->
    <div id="cryptoDonate" class="glim-modal-backdrop" hidden>
      <div
        class="glim-card glim-modal-card glim-crypto"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cryptoTitle"
      >
        <h2 class="glim-section-badge" id="cryptoTitle"></h2>
        <div class="glim-crypto-body">
          <p class="glim-crypto-intro" id="cryptoIntro"></p>
          <div class="glim-crypto-code">
            <div class="glim-crypto-qr" id="cryptoQr"></div>
            <p class="glim-crypto-address" id="cryptoAddress" dir="ltr"></p>
            <div class="glim-crypto-chains" id="cryptoChains" role="listbox"></div>
            <p class="glim-crypto-note" id="cryptoNote" hidden></p>
            <button id="cryptoCopy" type="button"></button>
          </div>
          <div class="glim-crypto-coins" id="cryptoCoins" role="listbox"></div>
        </div>
        <div class="glim-modal-actions">
          <button id="cryptoClose" class="secondary" type="button"></button>
        </div>
      </div>
    </div>

    <script src="appearance.js"></script>
    <script src="colorpicker.js"></script>
    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="tooltip.js"></script>
    <script src="donate.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script src="options.js"></script>
  </body>
</html>
