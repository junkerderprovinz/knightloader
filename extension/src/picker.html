<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="glimstone.css" />
    <link rel="stylesheet" href="flags.css" />
    <style>
      body {
        margin: 0;
        width: 372px;
        padding: 16px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: var(--text-body);
        line-height: 1.4;
      }
      h1 { margin: 0 0 10px; font-size: var(--text-body); font-weight: 600; color: var(--accent); }
      p#target { margin: 0 0 14px; color: var(--carbon-text-sub); overflow-wrap: anywhere; }
      #choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      /* Filled, not outlined - see options.html's own .row for why. */
      .choice {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      .choice:hover { background: var(--carbon-surface3); }
      .choice input { margin: 0; accent-color: var(--accent); }
      .choice .name { font-weight: 500; }
      .choice .url { color: var(--carbon-text-muted); font-size: var(--text-caption); word-break: break-all; }
      button {
        display: block;
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 8px;
        border: 0;
        border-radius: var(--radius-control);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .primary { background: var(--accent); color: var(--accent-contrast); }
      .secondary { background: var(--carbon-surface2); color: var(--carbon-text); }
    </style>
  </head>
  <body>
    <h1 id="heading">Send to…</h1>
    <p id="target">Loading…</p>
    <div id="choices"></div>
    <button id="send" class="primary">Send</button>
    <button id="cancel" class="secondary">Cancel</button>
    <!-- Appearance first: the look is put on <html> before anything is
         drawn, so no page is ever painted in one look and repainted in
         another. -->
    <script src="appearance.js"></script>
    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="tooltip.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
