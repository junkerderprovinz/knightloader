<!doctype html>
<!-- The tab that hands one site's sign-in to an instance (signin-page.js).
     lang and dir hold until i18n.js knows the language. -->
<html lang="en" dir="ltr" data-motion="subtle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="glimstone.css" />
    <style>
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 16px;
        box-sizing: border-box;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: 1.5;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .mark { display: block; height: 52px; width: auto; }
      h1 { margin: 0; font-size: var(--text-title); }
      #reason { margin: 0; color: var(--carbon-text-sub); }
      #handOver { align-self: flex-start; }
      #result { margin: 0; }
      #result.ok { color: var(--status-ok-text); }
      #result.warn { color: var(--status-warn-text); }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="" aria-hidden="true" class="mark" />
      <h1 id="title"></h1>
      <p id="reason"></p>
      <button id="handOver" class="primary" type="button" hidden></button>
      <p id="result" role="status" hidden></p>
    </main>
    <script src="appearance.js"></script>
    <script src="i18n.js"></script>
    <script src="i18n-capture.js"></script>
    <script src="i18n-signin.js"></script>
    <script src="shared.js"></script>
    <script src="capture.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="signin.js"></script>
    <script src="signin-page.js"></script>
  </body>
</html>
