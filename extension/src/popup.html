<!doctype html>
<!-- lang and dir hold until i18n.js knows the language, which it sets before any
     label is written. The extension has no motion setting, so the popup runs
     at GlimStone's default level. -->
<html lang="en" dir="ltr" data-motion="subtle">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="glimstone.css" />
    <link rel="stylesheet" href="flags.css" />
    <style>
      /* An id rule that sets `display` outranks the browser's own
         `[hidden] { display: none }`, so the attribute gets the weight to win. */
      [hidden] { display: none !important; }
      body {
        /* Wide enough for an instance card with its mark, name, status line
           and three square badges, and for a long page title. */
        margin: 0;
        width: 420px;
        padding: 16px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: 1.4;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      /* The SVG, since no PNG in icons/ has this size. The mark is tall, so the
         height is set. */
      .mark {
        display: block;
        height: 52px;
        width: auto;
        flex-shrink: 0;
      }
      /* The brand block's name (GlimStone 2.8.0), set beside the mark rather
         than under it because this header row also holds the settings badge.
         A wordmark stands outside the type scale, at the web UI's 20px. */
      h1 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--carbon-text);
      }
      /* The settings badge, the web UI's neutral IconBadge (ui.tsx) in plain
         CSS, at the one badge size of the extension (--btn-h). */
      .iconBadge {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: var(--btn-h);
        height: var(--btn-h);
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: var(--radius-pill);
        background: var(--carbon-surface2);
        color: var(--carbon-text-sub);
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }
      /* #target names what is about to be sent; popup.js shows it only for a
         parked send. */
      p {
        margin: 0 0 16px;
        color: var(--carbon-text-sub);
        overflow-wrap: anywhere;
      }
      /* Every button is --btn-h high and carries a glyph beside its label. */
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-sizing: border-box;
        width: 100%;
        height: var(--btn-h);
        padding: 0 12px;
        margin-bottom: 0;
        border: 0;
        border-radius: var(--radius-pill);
        font: inherit;
        font-weight: 500;
        /* A label never wraps, since the height is fixed; overflow keeps a long
           translation inside its own button. */
        white-space: nowrap;
        overflow: hidden;
        cursor: pointer;
      }
      button svg { flex-shrink: 0; }
      .primary { background: var(--accent); color: var(--accent-contrast); }
      /* The accent kind steps toward the text colour under the pointer
         (GlimStone 3.3.0); the subtle kind steps up the ramp with the tint in
         it (.glim-btn-subtle in glimstone.css). */
      .primary:not(:disabled):hover { background: var(--accent-hover); }
      .glim-btn-subtle { background: var(--carbon-surface2); color: var(--carbon-text); }
      /* 16px, the window's own padding, between every block. An empty status
         line takes no space. */
      #status { color: var(--carbon-text-muted); font-size: var(--text-subline); margin-top: 16px; }
      #status:empty { display: none; }
      #instanceRow { margin-bottom: 16px; }
      #instanceRow label { display: block; font-size: var(--text-meta); color: var(--carbon-text-muted); margin-bottom: 4px; }
      /* 16 between cards, as everywhere in the window; the label keeps a tight
         6px. */
      #instanceList { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
      #instanceLabel { margin: 0; }
      /* Send and its cancel share a row; cancel shows only while a countdown
         runs. flex-basis 0 splits the row evenly whatever the labels, since the
         base rule's width: 100% would otherwise squeeze one of them, and a
         button keeps its words (GlimStone 4.2.0): where both do not fit, the
         second goes to a row of its own. */
      .sendRow { display: flex; flex-wrap: wrap; gap: 8px; }
      .sendRow > button { flex: 1 1 0; min-width: max-content; }
      #tabs { margin-bottom: 12px; }
      /* Both panes share a minimum height so switching tabs does not resize the
         popup; the collector's field takes the rest. */
      #paneSend,
      #collector { min-height: 268px; }
      #collector { margin-top: 0; display: flex; flex-direction: column; gap: 8px; }
      #collector .drop { flex: 1; display: flex; }
      #collectorLabel { margin: 0; }
      /* The field itself is the drop target; a ring in the focus colour shows
         it while something is dragged over. */
      .drop { border-radius: var(--radius-control); transition: box-shadow 150ms ease; }
      .drop.over { box-shadow: 0 0 0 2px var(--focus-ring); }
      #links {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        font-size: var(--text-body);
        /* The field grows with the pane. */
        resize: none;
        outline: none;
        transition: background-color 150ms ease;
      }
      /* A text field shows its focus by stepping its fill up the ramp, with
         the caret, and without a ring (rule 14, GlimStone 4.2.0). */
      #links:focus { background: var(--carbon-surface3); }
      /* Two buttons sharing a line, split and wrapped as in .sendRow. */
      .collectorRow { display: flex; flex-wrap: wrap; gap: 8px; }
      .collectorRow button { flex: 1 1 0; min-width: max-content; }
      #media { margin-top: 16px; }
      #mediaLabel { margin: 0 0 6px; }
      #mediaList { display: flex; flex-direction: column; gap: 8px; }
      /* Kind, name over host, and the send badge at the end. */
      .mediaRow { display: flex; align-items: center; gap: 10px; }
      .mediaKind {
        flex-shrink: 0;
        min-width: 44px;
        padding: 2px 6px;
        border-radius: var(--radius-pill);
        background: var(--carbon-surface2);
        color: var(--carbon-text-sub);
        font-size: var(--text-meta);
        text-align: center;
      }
      .mediaName { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .mediaName > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mediaHost { color: var(--carbon-text-muted); font-size: var(--text-subline); }
      .mediaNone { margin: 0; color: var(--carbon-text-muted); font-size: var(--text-subline); }
      #cnlAccess { margin-bottom: 16px; }
      #videoRow { margin-top: 16px; }
      #cnlAccess button { margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="logo.svg" alt="" aria-hidden="true" class="mark" />
      <h1>KnightLoader</h1>
      <!-- No title attribute: popup.js sets the translated data-tip and
           aria-label, and a title would show the browser's own balloon beside
           the bubble (GlimStone 1.8.0). The aria-label is the name until
           popup.js runs. -->
      <button id="openOptions" class="iconBadge glim-btn-subtle" type="button" aria-label="Settings">
        <!-- The cog GlimStone gives Settings, Streamline's
             interface-essential/cog.svg (CC BY 4.0), half the badge's size. -->
        <svg width="16" height="16" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="m5.557 0.69 -0.463 1.195 -1.594 0.904 -1.27 -0.194a1.077 1.077 0 0 0 -1.078 0.528l-0.43 0.754a1.077 1.077 0 0 0 0.086 1.217l0.807 1.001v1.81L0.83 8.906a1.077 1.077 0 0 0 -0.086 1.217l0.43 0.754a1.077 1.077 0 0 0 1.078 0.528l1.27 -0.194 1.573 0.904 0.463 1.196a1.076 1.076 0 0 0 1 0.689h0.905a1.076 1.076 0 0 0 1.002 -0.69l0.463 -1.195 1.572 -0.904 1.27 0.194a1.077 1.077 0 0 0 1.078 -0.528l0.43 -0.754a1.077 1.077 0 0 0 -0.086 -1.217l-0.807 -1.001v-1.81l0.786 -1.001a1.077 1.077 0 0 0 0.086 -1.217l-0.43 -0.754a1.076 1.076 0 0 0 -1.078 -0.528l-1.27 0.194 -1.573 -0.904L8.443 0.689A1.077 1.077 0 0 0 7.442 0h-0.884a1.077 1.077 0 0 0 -1.001 0.69ZM7 9.25a2.25 2.25 0 1 0 0 -4.5 2.25 2.25 0 0 0 0 4.5Z"
          />
        </svg>
      </button>
    </div>
    <!-- Click'n'Load is wanted but the browser has not granted its access
         (cnlState in shared.js). The button leads to the options page, whose
         card asks for it: Chrome's prompt closes this window, and the request
         goes with it. -->
    <div id="cnlAccess" class="glim-unavailable" hidden>
      <span class="glim-unavailable-title" id="cnlAccessTitle"></span>
      <span class="glim-unavailable-reason" id="cnlAccessReason"></span>
      <button id="cnlAccessOpen" class="glim-btn-subtle" type="button"></button>
    </div>

    <!-- Instances and the link collector as two tabs, like the app. The strip
         appears once there is a group. -->
    <div id="tabs" class="glim-seg" role="group" hidden></div>

    <div id="paneSend">
      <p id="target">Loading the current page…</p>
      <div id="instanceRow" hidden>
        <p id="instanceLabel" class="glim-eyebrow">Send to</p>
        <div id="instanceList"></div>
      </div>
      <!-- Cancel comes first so the button that goes ahead ends the row
           (GlimStone 1.14.0); the flex row mirrors under a right-to-left
           language. Cancel shows only while a countdown runs. -->
      <div class="sendRow">
        <button id="cancelCountdown" class="glim-btn-subtle" type="button" hidden></button>
        <button id="send" class="primary">Send this page</button>
      </div>
      <!-- The video and audio this tab played, while finding media is on
           (popup-media.js). -->
      <div id="media" hidden>
        <p id="mediaLabel" class="glim-eyebrow"></p>
        <div id="mediaList"></div>
      </div>
      <!-- The download button on videos, the options page's switch one click
           away (popup-video.js). -->
      <div id="videoRow" class="glim-row" hidden>
        <span class="glim-row-label" id="videoLabel"></span>
        <button type="button" role="switch" aria-checked="false" id="videoEnabled" class="glim-switch">
          <span class="glim-switch-track"><span class="glim-switch-knob"></span></span>
        </button>
      </div>
    </div>

    <!-- The link collector: paste or drop links, or pick files. -->
    <div id="collector" hidden>
      <p id="collectorLabel" class="glim-eyebrow"></p>
      <div id="drop" class="drop">
        <textarea id="links" rows="3" spellcheck="false"></textarea>
      </div>
      <!-- One accent button per pane (GlimStone rule 3), and it is the one
           that sends; choosing files only fills the field. -->
      <div class="collectorRow">
        <button id="pickFiles" class="glim-btn-subtle" type="button"></button>
        <button id="addLinks" class="primary" type="button"></button>
      </div>
      <!-- Opened from the button beside it, since a native file input cannot
           be styled. -->
      <input id="files" type="file" multiple hidden />
    </div>

    <div id="status"></div>
    <!-- appearance.js first, so the look is on <html> before anything is
         drawn. -->
    <script src="appearance.js"></script>
    <script src="discoLoop.js"></script>
    <script src="disco.js"></script>
    <script src="i18n.js"></script>
    <script src="i18n-capture.js"></script>
    <script src="i18n-video.js"></script>
    <script src="glyphs.js"></script>
    <script src="shared.js"></script>
    <script src="capture.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="clipwatch.js"></script>
    <script src="tooltip.js"></script>
    <script src="selectorFit.js"></script>
    <script src="popup.js"></script>
    <script src="popup-media.js"></script>
    <script src="video.js"></script>
    <script src="popup-video.js"></script>
  </body>
</html>
