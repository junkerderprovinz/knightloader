<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="glimstone.css" />
    <style>
      body {
        /* 360, up from 280 (jdp, 2026-08-27: "Das Popupfenster der
           erweitterung soll größer sein"). A browser action popup may be up
           to 800x600; this is not about reaching that, it is that the old
           width made #target - a page title, which can be long - wrap to
           three or four lines under a heading of its own. Wider, it usually
           fits in one or two. */
        margin: 0;
        width: 360px;
        padding: 16px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: var(--text-body);
        line-height: 1.4;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      /* The app's own mark, at a size worth looking at (jdp, same message:
         "auch das logo in schöner größe anzeigen") rather than the 16px
         favicon the browser already shows in the toolbar - repeating that
         here at that size would add nothing. The SVG, not one of the PNGs in
         icons/: those exist at fixed sizes for the manifest, and this needs
         to be crisp at a size none of them is. It is tall (559x897), so the
         height is what is set and the width follows. */
      .mark {
        display: block;
        height: 52px;
        width: auto;
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: var(--text-heading);
        font-weight: 600;
        color: var(--accent);
      }
      /* The settings badge (jdp: "im fenster oben rechts ein quadratischer
         badge mit zahnrad um die einstellungen zu öffnen") — square, same
         neutral/hover pair as the main app's own IconBadge (neutral kind:
         web/src/components/ui.tsx), reused here in plain CSS since this
         extension has no build step to pull the component from. */
      .iconBadge {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text-sub);
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }
      .iconBadge:hover { background: var(--carbon-surface3); color: var(--carbon-text); }
      .iconBadge:active { transform: scale(0.97); }
      /* jdp, 2026-08-24: "da steht es doppelt" - not actually a second
         KnightLoader heading (there is only ever one <h1>), but #target
         below shows the ACTIVE TAB's own title with no label of its own -
         when that tab happens to be KnightLoader's own web app, its title
         IS "KnightLoader" too, and two bare, identically-styled lines read
         as a mistake even though they answer different questions ("this is
         the extension" vs "this is the page you're about to send"). This
         eyebrow makes that second line self-explanatory regardless of what
         page it names. The eyebrow treatment itself is .glim-eyebrow on the
         element, so only its spacing is left here. */
      #targetLabel { margin: 0 0 2px; }
      p {
        margin: 0 0 12px;
        color: var(--carbon-text-sub);
        overflow-wrap: anywhere;
      }
      button {
        display: block;
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 8px;
        border: 0;
        border-radius: var(--radius-control);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .primary { background: var(--accent); color: var(--accent-contrast); }
      .secondary { background: var(--carbon-surface2); color: var(--carbon-text); }
      #status { min-height: 1.2em; color: var(--carbon-text-muted); font-size: var(--text-caption); }
      #instanceRow { margin-bottom: 12px; }
      #instanceRow label { display: block; font-size: var(--text-caption); color: var(--carbon-text-muted); margin-bottom: 4px; }
      /* Shaped like a text field rather than left native: it sits under a
         label in the same column as the Send button. Same correction as
         options.html's own selects - a filled surface2 and no border, which
         is what the web UI's field actually is. */
      #instance {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        outline: none;
        transition: box-shadow 150ms ease;
      }
      #instance:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="logo.svg" alt="" aria-hidden="true" class="mark" />
      <h1>KnightLoader</h1>
      <button id="openOptions" class="iconBadge" type="button" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    <p id="targetLabel" class="glim-eyebrow">Sending</p>
    <p id="target">Loading the current page…</p>
    <div id="instanceRow" hidden>
      <label for="instance" id="instanceLabel">Send to</label>
      <select id="instance"></select>
    </div>
    <button id="send" class="primary">Send this page</button>
    <div id="status"></div>
    <!-- Appearance first: the look is put on <html> before anything is
         drawn, so no page is ever painted in one look and repainted in
         another. -->
    <script src="appearance.js"></script>
    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="tooltip.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
