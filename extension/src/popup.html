<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        background: #161616;
        color: #f4f4f4;
        font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: #fcc419;
      }
      p {
        margin: 0 0 12px;
        color: #c6c6c6;
        overflow-wrap: anywhere;
      }
      button {
        display: block;
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 8px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .primary { background: #fcc419; color: #161616; }
      .secondary { background: #393939; color: #f4f4f4; }
      #status { min-height: 1.2em; color: #8d8d8d; font-size: 11px; }
      #instanceRow { margin-bottom: 12px; }
      #instanceRow label { display: block; font-size: 11px; color: #8d8d8d; margin-bottom: 4px; }
      #instance {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 1px solid #393939;
        border-radius: 8px;
        background: #262626;
        color: #f4f4f4;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>KnightLoader</h1>
    <p id="target">Loading the current page…</p>
    <div id="instanceRow" hidden>
      <label for="instance">Send to</label>
      <select id="instance"></select>
    </div>
    <button id="send" class="primary">Send this page</button>
    <button id="openOptions" class="secondary">Instance settings</button>
    <div id="status"></div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
