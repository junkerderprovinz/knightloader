<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KnightLoader</title>
    <link rel="stylesheet" href="glimstone.css" />
    <link rel="stylesheet" href="flags.css" />
    <style>
      /* First, and !important, because an id rule that sets `display` outranks
         the browser's own `[hidden] { display: none }` - and then the attribute
         is a comment. `#collector { display: flex }` did exactly that, so the
         link collector was on screen from the first paint whether or not there
         was an instance to send to (jdp, 2026-08-31: "solange keine Instanz
         hinzugefügt wurde soll der linksammler ausgeblendet sein"). The code
         hiding it was correct the whole time; the stylesheet quietly refused.
         The same defect sat on the options page's own leave button. One rule
         per page in this family, so `hidden` means hidden everywhere. */
      [hidden] { display: none !important; }
      body {
        /* 420, up from 360, which was up from 280 (jdp, 2026-08-27: "Das
           Popupfenster der erweitterung soll größer sein"; 2026-08-29: "die
           instanzencards im popup auch größer"). A browser action popup may
           be up to 800x600; this is not about reaching that. 280 made #target
           - a page title, which can be long - wrap to three or four lines.
           360 fixed that and was then too narrow for the card the instances
           grew into: a 48px mark, a name, a status line and three 30px
           controls do not share 360 without the line being ellipsised into
           uselessness. */
        margin: 0;
        width: 420px;
        padding: 16px;
        background: var(--carbon-bg);
        color: var(--carbon-text);
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: var(--text-body);
        line-height: 1.4;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      /* The app's own mark, at a size worth looking at (jdp, same message:
         "auch das logo in schöner größe anzeigen") rather than the 16px
         favicon the browser already shows in the toolbar - repeating that
         here at that size would add nothing. The SVG, not one of the PNGs in
         icons/: those exist at fixed sizes for the manifest, and this needs
         to be crisp at a size none of them is. It is tall (559x897), so the
         height is what is set and the width follows. */
      .mark {
        display: block;
        height: 52px;
        width: auto;
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: var(--text-heading);
        font-weight: 600;
        color: var(--accent-ink);
      }
      /* The settings badge (jdp: "im fenster oben rechts ein quadratischer
         badge mit zahnrad um die einstellungen zu öffnen") — square, same
         neutral/hover pair as the main app's own IconBadge (neutral kind:
         web/src/components/ui.tsx), reused here in plain CSS since this
         extension has no build step to pull the component from. */
      .iconBadge {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text-sub);
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }
      .iconBadge:hover { background: var(--carbon-surface3); color: var(--carbon-text); }
      .iconBadge:active { transform: scale(0.97); }
      /* #target is the line naming what is about to be sent, and it is shown
         only when it says something nothing else does: a parked Click'n'Load
         batch, or a right-clicked link. For an ordinary toolbar click it is
         hidden, because there it repeated the button underneath ("send this
         page") and, on KnightLoader's own pages, the heading above it word
         for word - reported twice, a year apart in feeling: 2026-08-24 "da
         steht es doppelt", and 2026-08-29 "im popup steht KnightLoader wieder
         zweimal. das zweite (untere) entfernen". An eyebrow label was the
         first answer and it was the wrong one: it explained a line that did
         not need to be there. */
      p {
        margin: 0 0 16px;
        color: var(--carbon-text-sub);
        overflow-wrap: anywhere;
      }
      button {
        display: block;
        width: 100%;
        padding: 9px 12px;
        /* No bottom margin: the send button is the last block, and its own
           8px plus the window's 16px padding made the space below it half
           again the space above it. */
        margin-bottom: 0;
        border: 0;
        border-radius: var(--radius-control);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .primary { background: var(--accent); color: var(--accent-contrast); }
      .secondary { background: var(--carbon-surface2); color: var(--carbon-text); }
      /* One rhythm, 16px, the same value the window pads itself with (jdp,
         2026-08-29: "die instanzencards und der untere button haben zu sich
         und zum unteren fensterende unterschiedliche abstände"). The gap
         between the last card and the button was 12 while the gap below the
         button was 16 plus an always-present, always-empty status line worth
         another 17 - so the bottom looked heavier than the top for a reason
         that was not visible on screen. An empty status line now takes no
         space at all; a real message still pushes the window taller, which is
         honest, because a message appearing IS a change. */
      #status { color: var(--carbon-text-muted); font-size: var(--text-caption); margin-top: 16px; }
      #status:empty { display: none; }
      #instanceRow { margin-bottom: 16px; }
      #instanceRow label { display: block; font-size: var(--text-caption); color: var(--carbon-text-muted); margin-bottom: 4px; }
      /* Shaped like a text field rather than left native: it sits under a
         label in the same column as the Send button. Same correction as
         options.html's own selects - a filled surface2 and no border, which
         is what the web UI's field actually is. */
      #instance {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        outline: none;
        transition: box-shadow 150ms ease;
      }
      #instance:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
      /* 16, the same number as every other vertical gap in this window (jdp,
         2026-08-30: "Die abstaände zwischen den instanzen-cards und des
         buttons darunter sind unterschiedlich"). It was 8 while the gap under
         the last card was 16 - measured, not assumed: three cards rendered
         8/8/16, so the button sat visibly further from the stack than the
         cards sat from each other. The 1.9.0 pass that claimed "one rhythm"
         only made the button's own two sides match and never touched the
         list. Now: card to card, card to button and button to window edge are
         one number. The label above the list keeps its tight 6px - that gap
         belongs to the group it names, not to the rhythm between blocks. */
      #instanceList { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
      #instanceLabel { margin: 0; }
      /* Send and its cancel share a row; cancel is only there while a clock is
         running, so the send button is full width the rest of the time. */
      .sendRow { display: flex; gap: 8px; }
      .sendRow #send { flex: 1; }
      #tabs { margin-bottom: 12px; }
      /* The collector, one 16px step below the send button like everything
         else in this window. */
      #collector { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
      #collectorLabel { margin: 0; }
      /* The drop target IS the field, not a dashed rectangle around one: a
         drawn outline is the one thing this language does not do, so the
         "you may drop here" state is a change of SURFACE instead - the well
         one step deeper, and a ring in the focus colour while something is
         over it. */
      .drop { border-radius: var(--radius-control); transition: box-shadow 150ms ease; }
      .drop.over { box-shadow: 0 0 0 2px var(--focus-ring); }
      #links {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 0;
        border-radius: var(--radius-control);
        background: var(--carbon-surface2);
        color: var(--carbon-text);
        font: inherit;
        font-size: var(--text-dense);
        resize: vertical;
        outline: none;
      }
      #links:focus { box-shadow: 0 0 0 2px var(--focus-ring); }
      /* Two buttons sharing a line, each half of it: neither is the primary
         action of this window, so neither gets to be wider than the other. */
      .collectorRow { display: flex; gap: 8px; }
      .collectorRow button { flex: 1; }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="logo.svg" alt="" aria-hidden="true" class="mark" />
      <h1>KnightLoader</h1>
      <button id="openOptions" class="iconBadge" type="button" aria-label="Settings" title="Settings">
        <!-- The web UI's own gear (web/src/lib/icons.tsx, IconSettings), copied
             path for path. It was a STROKED outline here, which is the one
             thing the design language's icon rule forbids outright: a
             line-drawn glyph sits at a different weight than the filled badges
             and filled switches around it, and at 16px with a 2px stroke it
             stopped reading as a gear at all and became a blob. Caught in a
             store screenshot, not in the code. -->
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 0 1-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 0 1 .947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 0 1 2.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 0 1 2.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 0 1 .947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 0 1-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 0 1-2.287-.947zM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"
          />
        </svg>
      </button>
    </div>
    <!-- Two tabs, the same shape the app's instance view uses (jdp,
         2026-08-31: "Können wir im popupfenster zwei tabs machen wie inder app?
         Instanzen und Linksammler?"). The window was one long column: the
         instances, the send button, and then a collector nobody scrolled to.
         Two halves, one visible at a time, and the strip only appears once
         there is a group - with nothing to send to, a tab strip is two labels
         over an empty page. -->
    <div id="tabs" class="glim-seg" role="group" hidden></div>

    <div id="paneSend">
      <p id="target">Loading the current page…</p>
      <div id="instanceRow" hidden>
        <p id="instanceLabel" class="glim-eyebrow">Send to</p>
        <div id="instanceList"></div>
      </div>
      <!-- Send and cancel share a row while a countdown is running (jdp,
           2026-08-31: "Dort fehlt auch ein Abbrechen button wenn ein links
           reingeladen wird und der countdown läuft"). Cancel only exists while
           the clock does: a button that stops something not happening is a
           button that has to be explained. -->
      <div class="sendRow">
        <button id="send" class="primary">Send this page</button>
        <button id="cancelCountdown" class="secondary" type="button" hidden></button>
      </div>
    </div>

    <!-- The collector (jdp, 2026-08-30: "unter den instanzencards soll eine
         linksammler cards sein mit dropzone für links und button um dateien
         hinzuzufügen"). Everything above this point sends ONE thing that
         something else chose - the current tab, a right-clicked link, a caught
         container. This is the other direction: paste or drop whatever you
         have. Below the send button on purpose, because that button is what
         the window is usually opened for. -->
    <div id="collector" hidden>
      <p id="collectorLabel" class="glim-eyebrow"></p>
      <div id="drop" class="drop">
        <textarea id="links" rows="3" spellcheck="false"></textarea>
      </div>
      <div class="collectorRow">
        <button id="pickFiles" class="secondary" type="button"></button>
        <button id="addLinks" class="secondary" type="button"></button>
      </div>
      <!-- Hidden and clicked from the button beside it: a native file input
           cannot be styled into this language, and a button that opens it can. -->
      <input id="files" type="file" multiple hidden />
    </div>

    <div id="status"></div>
    <!-- Appearance first: the look is put on <html> before anything is
         drawn, so no page is ever painted in one look and repainted in
         another. -->
    <script src="appearance.js"></script>
    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="wordlist.js"></script>
    <script src="phrase.js"></script>
    <script src="relay.js"></script>
    <script src="group.js"></script>
    <script src="tooltip.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
