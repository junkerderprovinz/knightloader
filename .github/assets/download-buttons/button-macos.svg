<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720.0 245.3" width="720.0" height="245.3" role="img" aria-label="Download for macOS">
  <title>Download for macOS</title>
  <defs>
    <clipPath id="edge">
      <rect x="0" y="0" width="720.0" height="245.3" rx="38.2" ry="38.2"/>
    </clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pass {
      0%       { transform: translateX(-226.6px); }
      15.51%   { transform: translateX(946.6px); }
      100%     { transform: translateX(946.6px); }
    }
    /* linear, not eased: an eased pass varies the speed inside each button, so
       the hand-off at the seam arrives early or late and the row stops reading
       as one band.

       The fill mode is not decoration, it is the second half of the delay. An
       animation that has not started yet leaves its element wherever the
       document put it, which for this band is x=0 - INSIDE the button, against
       its left edge. Without it the stagger that makes the row read as one band
       also parks a motionless band on every button but the first, for as long
       as that button's delay, every time the page loads. */
    .band { animation: pass 8.196s linear 2.911s infinite backwards; }
    @media (prefers-reduced-motion: reduce) {
      .band { animation: none; opacity: 0; }
    }
  </style>
  <rect width="720.0" height="245.3" rx="38.2" ry="38.2" fill="#6e6e73"/>
  <g transform="translate(92.0 66.65) scale(0.21875)" fill="#ffffff">
    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
  </g>
  <text x="238" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#ffffff">macOS</text>
  <text x="240" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="400" fill="#ffffff" fill-opacity="0.72">Universal</text>
  <g clip-path="url(#edge)">
    <g class="band">
      <!-- Taller than the canvas and started off its left edge, so the tilt
           never exposes a corner. skewX rather than rotate: the band stays
           axis-aligned for the translate, so the motion is one transform. -->
      <rect x="0" y="-60" width="121.8" height="365.3"
            fill="url(#sheen)" transform="skewX(-16)"/>
    </g>
  </g>
</svg>
