version: 2

# Weekly version updates beside the security updates. Minor and patch updates
# of an ecosystem arrive together in one pull request across all its
# directories; a major update gets a pull request of its own.
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /desktop
      - /desktop/installer
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Vienna
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /web
      - /mobile
      - /scripts/e2e
      - /scripts/screenshots
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Vienna
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Vienna
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Vienna
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
