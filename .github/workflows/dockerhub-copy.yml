# Copies a released KnightLoader image from GHCR to Docker Hub without
# rebuilding it: for a release that came out before the Docker Hub push was set
# up, or one whose push there failed. The newest release also takes `latest`
# and its minor and major tags, as image-latest in release.yml does.
#
# Manual only, and without a gate: a missing token has to fail the run.
name: Docker Hub copy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to copy, such as 1.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: dockerhub-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the image
        env:
          RELEASE: ${{ inputs.version }}
          SOURCE: ghcr.io/junkerderprovinz/knightloader
          TARGET: docker.io/${{ vars.DOCKERHUB_USERNAME }}/knightloader
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${RELEASE#v}"
          case "$version" in
            *[!0-9.]* | "") echo "::error::'$RELEASE' is not a version like 1.3.0"; exit 1 ;;
          esac
          # A tag without a published release is not something to hand out.
          gh release view "v${version}" -R "$GITHUB_REPOSITORY" --json tagName > /dev/null
          newest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)"

          tags=(--tag "${TARGET}:${version}")
          if [ "$newest" = "v${version}" ]; then
            tags+=(--tag "${TARGET}:latest" --tag "${TARGET}:${version%.*}" --tag "${TARGET}:${version%%.*}")
          fi

          # A cross-registry copy of large layers now and then dies on a reset
          # stream, and a second try gets through.
          for attempt in 1 2 3; do
            if docker buildx imagetools create "${tags[@]}" "${SOURCE}:${version}"; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done

          want="$(docker buildx imagetools inspect "${SOURCE}:${version}" --format '{{json .Manifest.Digest}}')"
          got="$(docker buildx imagetools inspect "${TARGET}:${version}" --format '{{json .Manifest.Digest}}')"
          echo "GHCR ${want}, Docker Hub ${got}"
          test "$want" = "$got"
          printf '%s\n' "${tags[@]}" | grep -v -- '^--tag$'
