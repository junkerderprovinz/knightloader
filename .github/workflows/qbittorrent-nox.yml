name: qbittorrent-nox

# Builds the qbittorrent-nox the Windows and macOS apps run, without a window
# (GUI=OFF, as qBittorrent's own macOS CI builds it), at the pinned qBittorrent
# and libtorrent versions, and publishes it with its sources as a release that
# internal/qbittorrent/nox/versions.json points at. Linux and the container
# take userdocs/qbittorrent-nox-static instead.
#
# The release goes to the repository in the QBITTORRENT_RELEASES variable, or
# to this one, as qbittorrent-nox-v<version>, never marked latest so the app's
# own update check does not see it. Publishing elsewhere needs a token with
# contents: write there in the QBITTORRENT_RELEASES_TOKEN secret.

on:
  push:
    branches: [feat/qbittorrent]
    paths: [.github/workflows/qbittorrent-nox.yml]
  workflow_dispatch:
    inputs:
      qbittorrent:
        description: qBittorrent version
        default: "4.5.5"
        required: true
      libtorrent:
        description: libtorrent version
        default: "1.2.19"
        required: true
      publish:
        description: Publish the release
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: "6.5.3"
  AQT_VERSION: "3.3.0"
  # libtorrent 1.2 calls asio functions Boost 1.87 removed, and Homebrew and
  # vcpkg carry only newer releases.
  BOOST_VERSION: "1.86.0"
  BOOST_SHA256: "2575e74ffc3ef1cd0babac2c1ee8bdb5782a0ee672b1912da40e5b4b591ca01f"

jobs:
  # A dispatch builds the version it names, a push every pin of versions.json.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      pins: ${{ steps.pick.outputs.pins }}
    steps:
      - id: pick
        env:
          QBT: ${{ inputs.qbittorrent }}
          LT: ${{ inputs.libtorrent }}
        run: |
          if [ -n "$QBT" ]; then
            echo "pins=[{\"qbittorrent\":\"$QBT\",\"libtorrent\":\"$LT\"}]" >> "$GITHUB_OUTPUT"
          else
            echo 'pins=[{"qbittorrent":"4.5.5","libtorrent":"1.2.19"},{"qbittorrent":"4.6.7","libtorrent":"1.2.19"},{"qbittorrent":"5.0.5","libtorrent":"2.0.11"}]' >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: windows-amd64 ${{ matrix.pin.qbittorrent }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        pin: ${{ fromJSON(needs.versions.outputs.pins) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qbittorrent/qBittorrent
          ref: release-${{ matrix.pin.qbittorrent }}
          path: qbittorrent
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: arvidn/libtorrent
          ref: v${{ matrix.pin.libtorrent }}
          path: libtorrent
          submodules: recursive
      - name: Developer prompt
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem env: | ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md openssl zlib
          python -m pip install "aqtinstall==$env:AQT_VERSION"
          python -m aqt install-qt --outputdir "$env:RUNNER_TEMP\qt" windows desktop $env:QT_VERSION win64_msvc2019_64
      - name: Boost
        shell: pwsh
        run: |
          $dir = "boost_$($env:BOOST_VERSION -replace '\.', '_')"
          curl.exe -fsSL -o boost.tar.gz "https://archives.boost.io/release/$env:BOOST_VERSION/source/$dir.tar.gz"
          if ((Get-FileHash boost.tar.gz -Algorithm SHA256).Hash -ne $env:BOOST_SHA256) { throw "boost.tar.gz does not match its checksum" }
          tar -xzf boost.tar.gz
          Push-Location $dir
          .\bootstrap.bat
          .\b2 --with-system toolset=msvc address-model=64 link=static runtime-link=shared variant=release install --prefix="$env:RUNNER_TEMP\boost"
          Pop-Location
      - name: libtorrent
        shell: pwsh
        run: |
          cmake -S libtorrent -B lt-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\boost" -DBUILD_SHARED_LIBS=OFF -Ddeprecated-functions=OFF -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\lt"
          cmake --build lt-build
          cmake --install lt-build
      - name: qbittorrent-nox
        shell: pwsh
        run: |
          $qt = "$env:RUNNER_TEMP\qt\$env:QT_VERSION\msvc2019_64"
          # vcpkg's zlib brings a CMake package that names its static library
          # ZLIB::ZLIBSTATIC, while qBittorrent links ZLIB::ZLIB.
          Set-Content zlib-alias.cmake 'find_package(ZLIB REQUIRED)', 'if(NOT TARGET ZLIB::ZLIB AND TARGET ZLIB::ZLIBSTATIC)', '  add_library(ZLIB::ZLIB ALIAS ZLIB::ZLIBSTATIC)', 'endif()'
          $alias = (Join-Path (Get-Location) zlib-alias.cmake) -replace '\\', '/'
          cmake -S qbittorrent -B qbt-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_PREFIX_PATH="$qt;$env:RUNNER_TEMP\lt;$env:RUNNER_TEMP\boost" -DCMAKE_PROJECT_INCLUDE="$alias" -DQT6=ON -DGUI=OFF -DWEBUI=ON -DSTACKTRACE=OFF -DTESTING=OFF
          cmake --build qbt-build
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item qbt-build\qbittorrent-nox.exe out\
          & "$qt\bin\windeployqt.exe" --release --no-translations --no-compiler-runtime --no-opengl-sw out\qbittorrent-nox.exe
          Copy-Item qbittorrent\COPYING out\COPYING.txt
          $v = (& out\qbittorrent-nox.exe --version) -join ' '
          if ($v -notmatch "qBittorrent v${{ matrix.pin.qbittorrent }}") { throw "the build says: $v" }
          Compress-Archive -Path out\* -DestinationPath "qbittorrent-nox-${{ matrix.pin.qbittorrent }}-windows-amd64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-amd64-${{ matrix.pin.qbittorrent }}
          path: qbittorrent-nox-*.zip

  macos:
    name: darwin-${{ matrix.target.arch }} ${{ matrix.pin.qbittorrent }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        pin: ${{ fromJSON(needs.versions.outputs.pins) }}
        target:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qbittorrent/qBittorrent
          ref: release-${{ matrix.pin.qbittorrent }}
          path: qbittorrent
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: arvidn/libtorrent
          ref: v${{ matrix.pin.libtorrent }}
          path: libtorrent
          submodules: recursive
      - name: Dependencies
        run: |
          brew install openssl@3 ninja
          python3 -m pip install --break-system-packages "aqtinstall==$AQT_VERSION"
          python3 -m aqt install-qt --outputdir "$RUNNER_TEMP/qt" mac desktop "$QT_VERSION" clang_64
      - name: Boost
        run: |
          dir="boost_${BOOST_VERSION//./_}"
          curl -fsSL -o boost.tar.gz "https://archives.boost.io/release/$BOOST_VERSION/source/$dir.tar.gz"
          echo "$BOOST_SHA256  boost.tar.gz" | shasum -a 256 -c
          tar xzf boost.tar.gz
          cd "$dir"
          ./bootstrap.sh
          ./b2 --with-system link=static variant=release install --prefix="$RUNNER_TEMP/boost"
      - name: libtorrent
        run: |
          cmake -S libtorrent -B lt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/boost" \
            -DBUILD_SHARED_LIBS=OFF -Ddeprecated-functions=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/lt"
          cmake --build lt-build
          cmake --install lt-build
      - name: qbittorrent-nox
        run: |
          qt="$RUNNER_TEMP/qt/$QT_VERSION/macos"
          cmake -S qbittorrent -B qbt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$qt;$RUNNER_TEMP/lt;$RUNNER_TEMP/boost" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DQT6=ON -DGUI=OFF -DWEBUI=ON -DSTACKTRACE=OFF -DTESTING=OFF
          cmake --build qbt-build
          # qBittorrent builds even the nox as an app bundle on macOS, which
          # versions.json names as the asset's bin. The plugins stay in, since
          # Qt 6 brings TLS as one.
          app=qbittorrent-nox.app
          cp -R "qbt-build/$app" "$app"
          "$qt/bin/macdeployqt" "$app"
          codesign --force --deep --sign - "$app"
          cp qbittorrent/COPYING "$app/Contents/COPYING"
          v="$("$app/Contents/MacOS/qbittorrent-nox" --version)"
          case "$v" in *"qBittorrent v${{ matrix.pin.qbittorrent }}"*) ;; *) echo "the build says: $v"; exit 1 ;; esac
          ditto -c -k --keepParent "$app" "qbittorrent-nox-${{ matrix.pin.qbittorrent }}-darwin-${{ matrix.target.arch }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: darwin-${{ matrix.target.arch }}-${{ matrix.pin.qbittorrent }}
          path: qbittorrent-nox-*.zip

  release:
    if: inputs.publish || github.event_name == 'push'
    needs: [versions, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        pin: ${{ fromJSON(needs.versions.outputs.pins) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: "*-${{ matrix.pin.qbittorrent }}"
          merge-multiple: true
      - name: Sources
        # GPL section 6: the sources go out beside the programs built from them.
        run: |
          curl -fsSL -o "dist/qBittorrent-${{ matrix.pin.qbittorrent }}-source.tar.gz" \
            "https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-${{ matrix.pin.qbittorrent }}.tar.gz"
          curl -fsSL -o "dist/libtorrent-${{ matrix.pin.libtorrent }}-source.tar.gz" \
            "https://github.com/arvidn/libtorrent/releases/download/v${{ matrix.pin.libtorrent }}/libtorrent-rasterbar-${{ matrix.pin.libtorrent }}.tar.gz"
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.QBITTORRENT_RELEASES_TOKEN || github.token }}
          REPO: ${{ vars.QBITTORRENT_RELEASES || github.repository }}
        run: |
          tag="qbittorrent-nox-v${{ matrix.pin.qbittorrent }}"
          target=()
          if [ "$REPO" = "${{ github.repository }}" ]; then target=(--target "${{ github.sha }}"); fi
          gh release create "$tag" dist/* --repo "$REPO" "${target[@]}" --latest=false \
            --title "qbittorrent-nox ${{ matrix.pin.qbittorrent }} (libtorrent ${{ matrix.pin.libtorrent }})" \
            --notes "qbittorrent-nox ${{ matrix.pin.qbittorrent }} built without a window against libtorrent ${{ matrix.pin.libtorrent }} and Qt ${QT_VERSION}, for KnightLoader on Windows and macOS. qBittorrent is free software under the GPL and libtorrent under the BSD licence; both sources are attached."
