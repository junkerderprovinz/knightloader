name: desktop

# Builds the Wails desktop bundles as artifacts, by hand or from release.yml.
# It attaches nothing itself: release.yml publishes the release with the zips
# once this is done.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      KL_DLC_KEY:
        required: false
      KL_DLC_IV:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # platform names the target, which internal/update's Assets and the
        # manual are checked against; args is what scripts/desktop.mjs builds.
        include:
          # The installer, next to the portable exe in the zip.
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
            args: "--arch amd64 --installer"
          # Cross-built on the x64 runner: WebView2 needs no cgo, so the build
          # wants no ARM64 C compiler.
          - os: windows-latest
            platform: windows/arm64
            slug: windows-arm64
            args: "--arch arm64 --installer"
          - os: macos-latest
            platform: darwin/universal
            slug: macos-universal
            args: ""
          # Built natively: WebKitGTK is linked through cgo, and Wails does not
          # cross-compile to Linux.
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
            args: "--arch amd64"
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
            args: "--arch arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The root go.mod, not desktop/go.mod: the desktop module compiles the
      # server sources through its replace and needs their higher go directive.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # No libayatana-appindicator3-dev: Wails talks StatusNotifierItem over
      # D-Bus in pure Go on Linux.
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The installer needs makensis, and the runner image has dropped its
      # preinstalled NSIS before (actions/runner-images#11754).
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # The running job does not see choco's PATH change, and a missing
          # makensis would only surface at the last step.
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The CLI must match the library version in desktop/go.mod, so it is read
      # from there and the step fails if it cannot find it. bash on every
      # runner, and sed rather than grep -P, which BSD grep on macOS lacks. The
      # CLI links the Linux webview too, and without the tag it wants GTK 4,
      # which the runner does not have; elsewhere the tag changes nothing.
      - name: Install Wails
        working-directory: desktop
        shell: bash
        run: |
          version=$(sed -n 's|.*github\.com/wailsapp/wails/v3 \(v[0-9][0-9A-Za-z.-]*\).*|\1|p' go.mod | head -1)
          if [ -z "$version" ]; then
            echo "could not read the wails version out of desktop/go.mod" >&2
            exit 1
          fi
          echo "installing wails3 CLI $version, as required by desktop/go.mod"
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@"$version"

      # Only a tag build knows its version, which scripts/desktop.mjs reads
      # from the ref. Every other build keeps "dev", which never updates
      # itself. The DLC key is there when release.yml passes it or the run
      # was dispatched here; desktop.mjs keeps it out of the log.
      - name: Build
        run: node scripts/desktop.mjs ${{ matrix.args }}
        env:
          KL_DLC_KEY: ${{ secrets.KL_DLC_KEY }}
          KL_DLC_IV: ${{ secrets.KL_DLC_IV }}

      # A bundle that builds can still die on start: the tray and the window
      # both need the main thread on macOS. The app runs for a while with a
      # throwaway data folder and no JDownloader, and has to be alive with no
      # crash in its log.
      - name: Start the app
        if: runner.os == 'macOS'
        shell: bash
        env:
          KL_DATA: ${{ runner.temp }}/kl-data
          KL_JD: http://127.0.0.1:9
          KL_STARTUP_CHECK: "0"
        run: |
          log="$RUNNER_TEMP/kl-start.log"
          desktop/build/bin/KnightLoader.app/Contents/MacOS/KnightLoader > "$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            echo "::error::KnightLoader exited within 20 seconds of starting"
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          cat "$log"
          if grep -Eq "SIGTRAP|panic:|fatal error" "$log"; then
            echo "::error::the start log shows a crash"
            exit 1
          fi

      # What a first install on Windows goes through: the installer, a start
      # that provisions its own JDownloader, and the uninstaller the way the
      # Settings app runs it, without /S. JDownloader has to run without a
      # window of its own or a console, and the window must not wait for it.
      - name: Install, start and uninstall
        if: matrix.slug == 'windows-amd64'
        shell: pwsh
        timeout-minutes: 15
        env:
          KL_DATA: ${{ runner.temp }}\kl-data
          KL_STARTUP_CHECK: "0"
        run: |
          $installer = Get-Item desktop/build/bin/KnightLoader-*-installer.exe
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KnightLoader'
          $entry = Get-ItemProperty $key -ErrorAction SilentlyContinue
          if (-not $entry) { throw "the installer left no uninstall entry" }
          $exe = Join-Path $entry.InstallLocation 'KnightLoader.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing" }

          $app = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddMinutes(8)
          $java = $null
          do {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "KnightLoader exited with code $($app.ExitCode)" }
            $java = Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" |
              Where-Object { $_.CommandLine -like '*JDownloader.jar*' }
          } until ($java -or (Get-Date) -gt $deadline)
          if (-not $java) { throw "JDownloader did not start within eight minutes" }
          foreach ($p in $java) {
            if ($p.CommandLine -notlike '*-Djava.awt.headless=true*') { throw "JDownloader runs with a window: $($p.CommandLine)" }
          }
          Start-Sleep -Seconds 60
          $app.Refresh()
          if ($app.HasExited) { throw "KnightLoader exited with code $($app.ExitCode)" }
          Write-Host "KnightLoader window: '$($app.MainWindowTitle)'"
          $windows = Get-Process -Id ($java.ProcessId) -ErrorAction SilentlyContinue |
            Where-Object { $_.MainWindowHandle -ne 0 }
          if ($windows) { throw "JDownloader opened a window: $($windows.MainWindowTitle)" }
          $consoles = Get-CimInstance Win32_Process -Filter "Name = 'conhost.exe'" |
            Where-Object { $_.ParentProcessId -in @($java.ProcessId) } |
            ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue } |
            Where-Object { $_.MainWindowHandle -ne 0 }
          if ($consoles) { throw "java runs in a console window" }

          Stop-Process -Id $app.Id -Force
          foreach ($p in $java) { Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3

          $uninstall = $entry.UninstallString.Trim('"')
          Start-Process -FilePath $uninstall
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $key) { throw "the uninstaller left its entry behind" }
          if (Test-Path $exe) { throw "the uninstaller left $exe behind" }

      # Zipped on the build runner because artifacts lose file modes, which
      # left the Linux and macOS binaries without their execute bit. The zip
      # holds the program alone at its root, which internal/update expects, and
      # -y keeps symlinks inside the .app.
      - name: Zip the bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd desktop/build/bin
          zip -qry "$GITHUB_WORKSPACE/knightloader-${{ matrix.slug }}.zip" .
      - name: Zip the bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/build/bin/KnightLoader.exe -DestinationPath "knightloader-${{ matrix.slug }}.zip"
          Copy-Item desktop/build/bin/KnightLoader-*-installer.exe "knightloader-${{ matrix.slug }}-installer.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: knightloader-${{ matrix.slug }}
          path: |
            knightloader-${{ matrix.slug }}.zip
            knightloader-${{ matrix.slug }}-installer.exe
          if-no-files-found: error
