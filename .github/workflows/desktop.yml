name: desktop

# Builds the native desktop bundles (Windows/macOS/Linux) with Wails. Manual /
# tag-triggered because desktop packaging is a release step, separate from the
# always-on server build.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
          - os: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Deliberately the *root* go.mod, not desktop/go.mod. The desktop module
      # replaces the server module with ../, so it compiles the server sources
      # and inherits their higher go directive; pinning to the desktop module's
      # own (lower) version would fail to build the very code it wraps. This
      # also keeps the desktop bundles on the same compiler as the container.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Pinned to the same Wails version desktop/go.mod requires. With @latest a
      # new major of the CLI would silently start driving a v2 module and break
      # tag builds at the worst possible moment. Bump this together with the
      # require line in desktop/go.mod.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build
        working-directory: desktop
        run: |
          go mod tidy
          wails build -platform ${{ matrix.platform }} -clean

      - uses: actions/upload-artifact@v4
        with:
          name: knightloader-${{ matrix.platform }}
          path: desktop/build/bin/*
