name: desktop

# Builds the native desktop bundles (Windows/macOS/Linux) with Wails. Manual /
# tag-triggered because desktop packaging is a release step, separate from the
# always-on server build.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            slug: windows-amd64
            extra: ""
          - os: macos-latest
            platform: darwin/universal
            slug: macos-universal
            extra: ""
          # Wails binds webkit2gtk-4.0 unless told otherwise, and Ubuntu 24.04
          # does not carry it any more: 4.1 is the only one packaged. The apt
          # line below installs 4.1 correctly and the build still failed, with
          # pkg-config asking for "webkit2gtk-4.0, required by virtual:world",
          # which reads like a missing package rather than a version the distro
          # dropped. The tag is Wails' own answer to that (v2.6 and later), and
          # it is Linux-only because the other two platforms do not use webkit
          # at all. Carried as a whole flag string so the expansion is empty on
          # those two - the step runs under bash on Linux and pwsh on Windows,
          # and no conditional-expansion syntax works in both.
          - os: ubuntu-latest
            platform: linux/amd64
            slug: linux-amd64
            extra: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Deliberately the *root* go.mod, not desktop/go.mod. The desktop module
      # replaces the server module with ../, so it compiles the server sources
      # and inherits their higher go directive; pinning to the desktop module's
      # own (lower) version would fail to build the very code it wraps. This
      # also keeps the desktop bundles on the same compiler as the container.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No libayatana-appindicator3-dev here: the obvious next line for the
      # tray icon (package 21), but github.com/cardinalby/go-systray - a
      # Wails-compatible fork of fyne.io/systray, chosen specifically
      # because plain fyne.io/systray's macOS AppDelegate class collides
      # with Wails' own - implements the Linux tray over the
      # StatusNotifierItem D-Bus interface directly (godbus, pure Go), not
      # through libappindicator/GTK. Verified by reading
      # systray_unix.go/systray_menu_unix.go: no cgo directives, no
      # pkg-config, no gtk import anywhere in the unix-tagged sources - only
      # systray_darwin.go/.m link against Cocoa, which Xcode on the macOS
      # runner already provides. If the tray library is ever swapped for one
      # that draws the Linux icon through libappindicator/GTK instead,
      # revisit this step.
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Pinned to the same Wails version desktop/go.mod requires. With @latest a
      # new major of the CLI would silently start driving a v2 module and break
      # tag builds at the worst possible moment. Bump this together with the
      # require line in desktop/go.mod - this one had already drifted (go.mod
      # was on v2.13.0, this step still installing v2.10.2) before this change.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        working-directory: desktop
        run: |
          go mod tidy
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.extra }}

      # Named by the slug, not the platform string: "windows/amd64" contains a
      # slash, which artifact names and release assets both take badly.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knightloader-${{ matrix.slug }}
          path: desktop/build/bin/*
          if-no-files-found: error

  # Without this job the bundles are built on every tag and then thrown away
  # when the artifact expires: green CI, and nobody outside Actions can download
  # the desktop app at all. This attaches them to the release the tag creates.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles

      # One archive per platform, named for the tag, so a download sitting in
      # somebody's folder still says which version it is.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          for d in bundles/knightloader-*; do
            [ -d "$d" ] || continue
            slug="${d#bundles/knightloader-}"
            (cd "$d" && zip -qr "../../dist/knightloader-${GITHUB_REF_NAME}-${slug}.zip" .)
          done
          ls -lh dist

      # The release is created by release.yml on the same tag, and these builds
      # take twenty minutes longer than it does — but a runner queue can invert
      # that, and uploading to a release that does not exist yet fails outright.
      # So wait for it rather than racing it.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $GITHUB_REF_NAME is there"
              exit 0
            fi
            echo "waiting for release $GITHUB_REF_NAME ($i/30)"
            sleep 20
          done
          echo "release $GITHUB_REF_NAME never appeared; is release.yml failing?" >&2
          exit 1

      - name: Attach the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
