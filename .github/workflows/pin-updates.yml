name: Pinned components

# The Java runtime the desktop app fetches and RARLAB's UnRAR are pinned by hand
# with their checksums, where Renovate cannot see them. Once a week this looks
# for a newer release of each (scripts/pins/update-pins.mjs) and opens a pull
# request that moves the pins, one branch per component and version. ffmpeg
# needs nothing here: the app fetches BtbN's rolling build and checks it
# against that release's own checksums, and the image takes Alpine's.
#
# The branch is pushed with RENOVATE_DIST_TOKEN, as in dependency-fixups.yml,
# and ci.yml runs on that push. The pull request itself is opened with
# GITHUB_TOKEN, which starts no workflow, and which needs "Allow GitHub Actions
# to create and approve pull requests" in the repository's Actions settings.

on:
  schedule:
    # Monday morning, beside Renovate's run.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-updates
  cancel-in-progress: false

jobs:
  pins:
    strategy:
      fail-fast: false
      matrix:
        component: [temurin, unrar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GIT_AUTHOR_NAME: KnightLoader CI
      GIT_AUTHOR_EMAIL: ci@knightloader.invalid
      GIT_COMMITTER_NAME: KnightLoader CI
      GIT_COMMITTER_EMAIL: ci@knightloader.invalid
    steps:
      # The pull request goes to main, so the pins are read there, whichever
      # branch a manual run was started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Look for a newer release
        id: check
        run: node scripts/pins/update-pins.mjs "$COMPONENT"
        env:
          COMPONENT: ${{ matrix.component }}

      # A pull request for this version that was closed unmerged turned it
      # down, so there is never a second one. A branch without a pull request
      # is left from a run that could not open one, and is replaced.
      - name: Open the pull request
        if: steps.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.RENOVATE_DIST_TOKEN }}
          BRANCH: ${{ steps.check.outputs.branch }}
          TITLE: ${{ steps.check.outputs.title }}
          BODY: ${{ steps.check.outputs.body }}
          FILES: ${{ steps.check.outputs.files }}
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number --jq length)" != 0 ]; then
            echo "$BRANCH already has a pull request"
            exit 0
          fi
          read -ra paths <<< "$FILES"
          git switch -c "$BRANCH"
          git add -- "${paths[@]}"
          git commit -m "$TITLE"
          git push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
