name: Release (browser extension)

# The extension is versioned in src/manifest.json and tagged on its own, since
# it installs and upgrades separately. Most people get it from Settings >
# Browser tools, which serves the copy embedded in their server
# (extension/embed.go); this zip is for store submissions and fixed downloads.
on:
  push:
    tags:
      - "extension/v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Tag matches the manifest
        id: version
        if: github.ref_type == 'tag'
        run: |
          tagged="${GITHUB_REF_NAME#extension/v}"
          echo "bare=$tagged" >> "$GITHUB_OUTPUT"
          declared=$(node -p "require('./extension/src/manifest.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag says $tagged, manifest.json says $declared - bump the manifest before tagging."
            exit 1
          fi
          echo "version $declared"

      # action-gh-release publishes an empty release when body_path cannot be
      # read, with only a warning in the log.
      - name: Notes exist for this tag
        if: github.ref_type == 'tag'
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file - write them before tagging."
            exit 1
          fi
          wc -l "$file"

      # The same checks CI runs, repeated so a release cannot skip them.
      - name: Syntax, locale parity and refusals
        run: |
          for f in extension/src/*.js; do node --check "$f"; done
          node extension/check-locales.mjs
          node extension/check-refusals.mjs
          node extension/check-popup-send.mjs
          node extension/check-background.mjs
          node extension/check-relay-seal.mjs
          node extension/check-crypto-tab.mjs
          node extension/check-palette-edit.mjs

      # Same lint and skip list as ci.yml, which explains the skipped codes.
      - name: web-ext lint
        run: |
          cd extension/src
          out=$(npx --yes web-ext lint --self-hosted --output=json 2>/dev/null || true)
          printf '%s' "$out" | node -e '
            let s = ""; process.stdin.on("data", c => s += c).on("end", () => {
              let r; try { r = JSON.parse(s); } catch { console.error("web-ext lint produced no JSON"); process.exit(1); }
              const skip = new Set(["BACKGROUND_SERVICE_WORKER_IGNORED", "KEY_FIREFOX_ANDROID_UNSUPPORTED_BY_MIN_VERSION"]);
              const bad = [...(r.errors ?? []), ...(r.warnings ?? [])].filter(m => !skip.has(m.code));
              for (const m of bad) console.error(`${m.code}: ${m.message} (${m.file ?? "manifest.json"})`);
              if (bad.length) { console.error(`${bad.length} web-ext finding(s)`); process.exit(1); }
              console.log("web-ext lint clean");
            });
          '

      # Zipped from inside src/ so the archive unpacks to a loadable extension.
      - name: Zip it
        id: zip
        run: |
          v="${GITHUB_REF_NAME#extension/v}"
          out="knightloader-extension-$v.zip"
          (cd extension/src && zip -qr "../../$out" .)
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        # A dispatched run only checks that the zip builds; from a branch it
        # would find no notes and publish an empty release.
        if: github.ref_type == 'tag'
        with:
          name: Browser Extension ${{ steps.version.outputs.bare }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          # The Latest badge belongs to the main vX.Y.Z release, and GitHub
          # would otherwise give it to whatever was published last.
          make_latest: false
          files: ${{ steps.zip.outputs.path }}

      # For the README download button; see .github/scripts/publish-newest.sh.
      - name: The newest zip under a fixed name
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: bash .github/scripts/publish-newest.sh extension "$ZIP" knightloader-extension.zip "Browser Extension"
