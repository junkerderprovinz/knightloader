name: Release (browser extension)

# The extension carries its own version in src/manifest.json and is tagged on
# its own, for the same reason the app is: it is installed separately and
# upgrades separately.
#
# ONE honest caveat, because the shape here is unusual. The copy most people
# run does NOT come from this release: Settings > Browser tools serves a zip
# built from the extension embedded in whatever server binary they are running
# (extension/embed.go), so that copy tracks the server, not this tag. This tag
# and its zip exist for a browser store submission and for anyone who wants a
# fixed, downloadable build - not as the primary channel.
on:
  push:
    tags:
      - "extension/v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Tag matches the manifest
        id: version
        if: github.ref_type == 'tag'
        run: |
          tagged="${GITHUB_REF_NAME#extension/v}"
          echo "bare=$tagged" >> "$GITHUB_OUTPUT"
          declared=$(node -p "require('./extension/src/manifest.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag says $tagged, manifest.json says $declared - bump the manifest before tagging."
            exit 1
          fi
          echo "version $declared"

      # action-gh-release swallows an unreadable body_path and publishes an
      # EMPTY release, with only a warning buried in the log - quieter than a
      # failure and just as wrong. release.yml probes for the file and falls
      # back to generated notes; here a release without hand-written notes is a
      # mistake, so it stops instead.
      - name: Notes exist for this tag
        if: github.ref_type == 'tag'
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file - write them before tagging."
            exit 1
          fi
          wc -l "$file"

      # The same gates CI runs, repeated here rather than assumed: a release is
      # exactly the moment a locale short one key, or a control that refuses in
      # the wrong way, would ship unnoticed.
      - name: Syntax, locale parity and refusals
        run: |
          for f in extension/src/*.js; do node --check "$f"; done
          node extension/check-locales.mjs
          node extension/check-refusals.mjs
          node extension/check-popup-send.mjs
          node extension/check-background.mjs
          node extension/check-relay-seal.mjs

      # The same lint and skip list as ci.yml, where the two skipped codes are
      # explained. The zip below is what goes to AMO, so its lint result is the
      # one that counts.
      - name: web-ext lint
        run: |
          cd extension/src
          out=$(npx --yes web-ext lint --self-hosted --output=json 2>/dev/null || true)
          printf '%s' "$out" | node -e '
            let s = ""; process.stdin.on("data", c => s += c).on("end", () => {
              let r; try { r = JSON.parse(s); } catch { console.error("web-ext lint produced no JSON"); process.exit(1); }
              const skip = new Set(["BACKGROUND_SERVICE_WORKER_IGNORED", "KEY_FIREFOX_ANDROID_UNSUPPORTED_BY_MIN_VERSION"]);
              const bad = [...(r.errors ?? []), ...(r.warnings ?? [])].filter(m => !skip.has(m.code));
              for (const m of bad) console.error(`${m.code}: ${m.message} (${m.file ?? "manifest.json"})`);
              if (bad.length) { console.error(`${bad.length} web-ext finding(s)`); process.exit(1); }
              console.log("web-ext lint clean");
            });
          '

      # src/ ships as plain files - no build step - so the zip is the directory
      # itself. Built from src/ rather than from the repo root so the archive
      # unpacks to a loadable extension rather than to a path.
      - name: Zip it
        id: zip
        run: |
          v="${GITHUB_REF_NAME#extension/v}"
          out="knightloader-extension-$v.zip"
          (cd extension/src && zip -qr "../../$out" .)
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        # A workflow_dispatch run is for checking that the zip still builds.
        # Without this it reaches here with github.ref_name holding a BRANCH,
        # looks for release notes under that name, finds none, and publishes an
        # empty release from a branch - the silent-empty-release failure the
        # notes gate above exists to prevent, arriving through the one door
        # that gate skips.
        if: github.ref_type == 'tag'
        with:
          # See release-mobile.yml for why the product is named here rather
          # than left as the bare ref.
          name: Browser Extension ${{ steps.version.outputs.bare }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          # NOT the repository's "Latest" release. That badge belongs to the
          # PRODUCT's own tag (v1.0.0 and up), and a surface release is a
          # component of it: a visitor who lands on the releases page and sees
          # "Latest: Browser Extension 1.19.0" reads it as the version of
          # KnightLoader, which it is not. GitHub marks whatever was published
          # most recently unless told otherwise, so this has to be said out loud
          # in every workflow that is not the product's own.
          make_latest: false
          files: ${{ steps.zip.outputs.path }}

      # The newest zip also goes to the standing release extension/latest, as
      # knightloader-extension.zip, which is where the README download button
      # leads. .github/scripts/publish-newest.sh says why, and why only the
      # newest tag does it. A pushed tag only: a dispatched run publishes
      # nothing.
      - name: The newest zip under a fixed name
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: bash .github/scripts/publish-newest.sh extension "$ZIP" knightloader-extension.zip "Browser Extension"
