name: GlimStone update

on:
  repository_dispatch:
    types: [glimstone-release]
  # Catches a release whose dispatch never arrived.
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
      issues: write
      actions: write
    uses: junkerderprovinz/junkerderprovinz/.github/workflows/glimstone-update.yml@main
    with:
      ci-workflow: ci.yml
    secrets: inherit
