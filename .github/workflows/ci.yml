name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lets the expensive suites skip changes that cannot affect them, such as an
  # actions-only Renovate bump.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR's file list via the API
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      docs: ${{ steps.filter.outputs.docs }}
      queuereach: ${{ steps.filter.outputs.queuereach }}
    steps:
      # On push, paths-filter diffs with git and needs the history; on
      # pull_request it uses the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            # The crypto window's list is held to the web UI's.
            extension:
              - 'extension/**'
              - 'web/src/lib/donate.ts'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'web/src/lib/donate.ts'
              - '.github/workflows/ci.yml'
            # The desktop module replaces the main one, so a change to either
            # can break it.
            desktop:
              - 'desktop/**'
              - '**/*.go'
              - 'go.mod'
              - '.github/workflows/ci.yml'
            # check-docs-claims.mjs checks the documents against the sources,
            # so Go and web changes can falsify a claim too. desktop/go.mod is
            # listed because the check compares its Wails version with the
            # README, and **/*.go does not match a go.mod.
            docs:
              - 'README.md'
              - 'docs/**'
              - 'check-docs-claims.mjs'
              - '**/*.go'
              - 'desktop/go.mod'
              - 'Dockerfile'
              - 'web/src/lib/locales/**'
              - 'web/src/pages/settings/Help.tsx'
              - '.github/workflows/ci.yml'
            # Either side can break the queue-reach check: every Go file, and
            # every web file that decides whether a queue verb is reachable.
            queuereach:
              - '**/*.go'
              - 'check-queue-reach.mjs'
              - 'web/src/components/ListToolbar.tsx'
              - 'web/src/pages/Downloads.tsx'
              - 'web/src/lib/commands/downloads.ts'
              - 'web/src/lib/api.ts'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The suite takes about 12 minutes, and a slow runner cancelled good runs
    # at 20. -timeout below names the hanging package, a job cancellation does
    # not.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Read from go.mod so CI and the Dockerfile's build stage cannot drift
      # apart.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # CGO_ENABLED=0 as in the shipped binary, so a cgo-only dependency fails
      # here rather than in the image build. The explicit -timeout replaces Go's
      # 10m per package, which internal/app runs close to. KNIGHTLOADER_NET_TESTS
      # enables the tests that listen beyond loopback (discovery multicast, live
      # torrents); they are off locally because Windows asks about the firewall
      # for every new test binary. See internal/testenv.
      - name: Test
        env:
          CGO_ENABLED: "0"
          KNIGHTLOADER_NET_TESTS: "1"
        run: go test ./... -count=1 -timeout 25m

      # The race detector needs cgo, so it gets its own pass. Its timeout has to
      # fit in what is left of the 40 minute job after the pass above, or
      # Actions cancels the run with no goroutine dump.
      - name: Test (race)
        env:
          KNIGHTLOADER_NET_TESTS: "1"
        run: go test -race ./... -count=1 -timeout 12m

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/knightloader ./cmd/knightloader

      # The bridgeclipboard tag stays out of the shipped build (see
      # internal/bridge/clipboard.go), so nothing above compiles it.
      - name: Vet, test and build (bridge clipboard tag)
        env:
          CGO_ENABLED: "0"
        run: |
          go vet -tags bridgeclipboard ./...
          go test -tags bridgeclipboard ./internal/bridge/... -count=1
          go build -tags bridgeclipboard -o /tmp/knightloader-bridgeclipboard ./cmd/knightloader

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Every locale is typed as Dict derived from English, so this is the key
      # parity gate. Vite strips types without checking them.
      - name: Type check
        run: npx tsc --noEmit

      - name: Settings pages parity
        run: node check-settings-pages.mjs

      - name: Settings search index
        run: node check-settings-search.mjs

      - name: Ranking and folding
        run: node check-rank.mjs

      - name: List column widths
        run: node check-column-widths.mjs

      - name: Hover ramp
        run: node check-hover-ramp.mjs

      - name: Search query parser
        run: node check-search-query.mjs

      - name: No Go timestamp read as a yes/no
        run: node check-go-timestamps.mjs

      - name: Untranslated ledger
        run: node check-untranslated.mjs

      - name: Locale placeholders
        run: node check-locale-placeholders.mjs

      - name: Modal scrim
        run: node check-scrim.mjs

      - name: Theme tokens
        run: node check-theme-tokens.mjs

      - name: Motion tokens
        run: node check-motion-tokens.mjs

      - name: The hidden motion level stays hidden
        run: node check-hidden-motion-level.mjs

      - name: The top motion level is wild
        run: node check-motion-top-level.mjs

      - name: Dimmed and inert at once
        run: node check-dimmed-and-inert.mjs

      - name: Brand marks
        run: node check-brand-marks.mjs

      - name: No status colour on a control
        run: node check-no-status-on-control.mjs

      - name: Button order
        run: node check-button-order.mjs

      - name: The passkey refusal is the app's own copy
        run: node check-passkey-reason.mjs

      - name: The enrolment buttons say one word
        run: node check-enrolment-buttons.mjs

      - name: A placeholder is not a label
        run: node check-placeholder-as-label.mjs

      - name: Row drag arithmetic
        run: node check-row-drag.mjs

      - name: A card does not react to the pointer
        run: node check-card-hover.mjs

      - name: A row strip wears the row's own ground
        run: node check-row-strip-ground.mjs

      - name: The app mark never outgrows the rail's own
        run: node check-mark-scale.mjs

      - name: A picker tile hovers to the tile grey
        run: node check-tile-hover.mjs

      - name: A stretched plot does not decide its card's height
        run: node check-stretched-svg-height.mjs

      - name: Donation addresses
        run: node check-donate-addresses.mjs

      - name: Build UI
        run: npm run build

      # web/dist is committed and embedded in the binary. Bundle names carry no
      # content hash (see spaHandler in internal/api/api.go), so the output is
      # stable enough to diff.
      - name: Committed bundle is current
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::web/dist does not match the sources. Run 'npm run build' in web/ and commit the result."
            exit 1
          fi

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # The extension has no build step, so nothing else parses these files
      # before a browser does.
      - name: Syntax check
        run: for f in extension/src/*.js; do node --check "$f"; done

      - name: Locale parity
        run: node extension/check-locales.mjs

      - name: Relay frame parity
        run: node extension/check-relay-seal.mjs

      - name: Refusals
        run: node extension/check-refusals.mjs

      - name: Donation addresses
        run: node extension/check-donate.mjs

      - name: Send label
        run: node extension/check-popup-send.mjs

      - name: Background
        run: node extension/check-background.mjs

      # --self-hosted checks the package without AMO listing metadata. Two codes
      # are skipped: a cross-browser manifest always declares both background
      # forms, and the add-on is desktop Firefox only, so the Android minimum
      # version notice does not apply. Raising strict_min_version would drop
      # Firefox ESR 140, and adding gecko_android would list it on Android.
      - name: web-ext lint
        run: |
          cd extension/src
          out=$(npx --yes web-ext lint --self-hosted --output=json 2>/dev/null || true)
          printf '%s' "$out" | node -e '
            let s = ""; process.stdin.on("data", c => s += c).on("end", () => {
              let r; try { r = JSON.parse(s); } catch { console.error("web-ext lint produced no JSON"); process.exit(1); }
              const skip = new Set(["BACKGROUND_SERVICE_WORKER_IGNORED", "KEY_FIREFOX_ANDROID_UNSUPPORTED_BY_MIN_VERSION"]);
              const bad = [...(r.errors ?? []), ...(r.warnings ?? [])].filter(m => !skip.has(m.code));
              for (const m of bad) console.error(`${m.code}: ${m.message} (${m.file ?? "manifest.json"})`);
              if (bad.length) { console.error(`${bad.length} web-ext finding(s)`); process.exit(1); }
              console.log("web-ext lint clean");
            });
          '

  # A separate job because it also reads Go, and the web job skips Go-only
  # changes.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Documented claims
        run: node check-docs-claims.mjs

  # Compares the browser's queue state sets with the server's in both
  # directions. A separate job for the same reason as docs.
  queue-reach:
    needs: changes
    if: needs.changes.outputs.queuereach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: The queue verbs reach as far as the server does
        run: node check-queue-reach.mjs

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # No native build here; that needs an Android SDK. The type check catches
      # missing locale keys.
      - name: Type check
        run: npx tsc --noEmit

      - name: FlatList extraData
        run: node check-extradata.mjs

      - name: Hidden motion level
        run: node check-hidden-motion-level.mjs

      - name: Dimmed and inert
        run: node check-dimmed-and-inert.mjs

      - name: Donation addresses
        run: node check-donate.mjs

  # Compiles the desktop module on every relevant push, since desktop.yml only
  # runs for releases. Packaging stays in desktop.yml. webkit2_41 is needed
  # because Ubuntu 24.04 ships only webkit2gtk-4.1.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # Wails links against WebKitGTK even for a plain go build.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Build
        run: go build -tags webkit2_41 ./...
