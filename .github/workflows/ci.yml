name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nothing in this workflow deploys, so a newer push to the same ref makes the
# older run pointless. Cancelling it keeps the queue short on a repo where
# several branches move at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap up-front check so the expensive suites below can skip themselves on
  # changes that can't affect them (a Renovate github-actions-only bump, a
  # docs-only edit) instead of always running the full Go race-test pass and
  # web build. Always re-runs both suites when ci.yml itself changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR's file list via the API
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      # Only needed for the push-to-main case: paths-filter diffs against the
      # previous commit via git, which needs it to be present locally. On
      # pull_request it skips this entirely and uses the GitHub API instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            extension:
              - 'extension/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            # The desktop module is its own Go module that `replace`s the main
            # one, so a change to either can break it - hence both paths.
            desktop:
              - 'desktop/**'
              - '**/*.go'
              - 'go.mod'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # 40, not 20. The suite takes ~12 min on a healthy runner, and internal/app
    # alone is ~7.5 of that (it drives the queue and engine end to end, so much
    # of it is real waiting). At 20 a merely slow runner CANCELLED a good run -
    # measured: the identical commit passed on rerun. A job timeout is a
    # runaway backstop, not a performance budget; if the suite ever really does
    # hang, -timeout below reports WHICH package, which a job cancellation
    # never does.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The toolchain is read from go.mod's go directive, not pinned here, so
      # CI, the Dockerfile's golang:1.26-alpine stage and a developer's local
      # build are always the same compiler. A second hard-coded copy of the
      # version is how CI stays green while the release image fails to build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Vet walks every package in the module, including new ones that have no
      # test yet, so nothing can land without at least being type-checked.
      - name: Vet
        run: go vet ./...

      # The shipped binary is pure Go (modernc SQLite, CGO_ENABLED=0), so the
      # normal test pass runs in exactly that configuration. A dependency that
      # only compiles with cgo would pass a default `go test` and then break
      # the container build.
      # -timeout is explicit rather than Go's default 10m PER PACKAGE, which
      # internal/app runs close enough to trip on a loaded machine. When it
      # does, the panic names whichever test happened to be running - which is
      # not the slow one, and has already sent someone chasing the wrong test.
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1 -timeout 25m

      # The race detector needs cgo and therefore cannot share the pure-Go pass
      # above. It gets its own run because the engine, the throttle and the
      # federation hub are all goroutine-heavy: a data race there surfaces as a
      # silently corrupted download rather than as a crash, which no functional
      # test would catch.
      # The number has to fit in what is LEFT of the job, not in the job. The
      # steps run one after another: the pure-Go pass above may take up to its
      # own 25m, so this one can start around minute 13 on a normal run and far
      # later on a slow one. A 35m deadline could therefore never fire inside a
      # 40-minute job - the run would be cancelled by Actions first, with no
      # panic, no goroutine dump and no package name, which is precisely the
      # outcome the -timeout above exists to prevent. 12m is what reliably
      # remains, and it is still comfortably more than the ~12 min the whole
      # suite takes when it is healthy.
      - name: Test (race)
        run: go test -race ./... -count=1 -timeout 12m

      # Same flags as the Dockerfile, so a build that only fails when cgo is off
      # is caught here instead of during the release image build.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/knightloader ./cmd/knightloader

      # -tags bridgeclipboard is deliberately not part of any of the runs
      # above: it must not ship in the plain build the Dockerfile produces
      # (internal/bridge/clipboard.go's package comment explains why), which
      # also means nothing above ever compiles or tests it. Without this run
      # that file could sit broken for a whole wave before anyone building
      # with the tag noticed. Still CGO_ENABLED=0, because the tagged build
      # ships from the same static binary as everything else.
      - name: Vet, test and build (bridge clipboard tag)
        env:
          CGO_ENABLED: "0"
        run: |
          go vet -tags bridgeclipboard ./...
          go test -tags bridgeclipboard ./internal/bridge/... -count=1
          go build -tags bridgeclipboard -o /tmp/knightloader-bridgeclipboard ./cmd/knightloader

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly the committed lockfile. `npm install` would
      # quietly resolve the caret ranges to newer versions on every run, so the
      # thing CI builds would stop being the thing anyone else builds.
      - name: Install
        run: npm ci

      # This is the key-parity gate for the 26 locale catalogues: every locale
      # is declared `: Dict`, and Dict is Record<TranslationKey, string> derived
      # from English, so a missing or misspelled key is a compile error. Vite
      # builds with esbuild, which strips types without checking them, so the
      # build below would happily ship a half-translated locale. Hence a
      # separate, non-skippable step.
      - name: Type check
        run: npx tsc --noEmit


      - name: Build UI
        run: npm run build

      # web/dist is COMMITTED and embedded into the Go binary (web/embed.go's
      # //go:embed all:dist, and the Dockerfile skips a Node stage entirely
      # because of it). Nothing was checking that the committed bundle matched
      # the sources, so a change touching only .tsx files got a fully green
      # pipeline while the container went on serving the previous UI - a gap
      # this repository's own history has had to reconcile with several
      # after-the-fact "chore(web): rebuild web/dist" commits.
      #
      # The gate is only possible because the bundle names carry no content
      # hash (see spaHandler's doc comment in internal/api/api.go for why),
      # which makes the output stable enough to diff.
      - name: Committed bundle is current
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::web/dist does not match the sources. Run 'npm run build' in web/ and commit the result."
            exit 1
          fi

  # The extension and the app had no gate at all, which is how a syntax error
  # or a locale short one key would have reached a release: neither ships
  # through the web build, and the extension deliberately has no build step of
  # its own (see extension/embed.go). Both jobs are seconds long.
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # Plain files loaded by <script> and importScripts, so nothing else ever
      # parses them before a browser does.
      - name: Syntax check
        run: for f in extension/src/*.js; do node --check "$f"; done

      # The parity gate the web UI and the app get from `: Dict` for free.
      - name: Locale parity
        run: node extension/check-locales.mjs

      # Three implementations speak the relay frame format - Go, the phone's
      # TypeScript and this extension's plain JavaScript - and this was the
      # only one with no test at all. It checks the shipped src/relay.js
      # against the same fixed vector internal/relay pins, and then drives a
      # real session against a fake socket to read what the hello frame
      # actually puts on the wire. Proven red against a version that sealed
      # the identity AND went on announcing it in the clear beside the seal:
      # the one broken shape every format-level check passes.
      - name: Relay frame parity
        run: node extension/check-relay-seal.mjs

      # Mozilla's own linter, run with --self-hosted so it checks the package
      # rather than AMO listing metadata this repository does not have.
      #
      # It exists here because the failure class it catches is invisible to
      # everything above and expensive everywhere else. The extension shipped
      # for a day with background.js calling importScripts() while the manifest
      # declared BOTH background.service_worker and background.scripts: Chrome
      # takes the service worker and is fine, Firefox ignores service_worker
      # (this linter says so, BACKGROUND_SERVICE_WORKER_IGNORED) and runs the
      # scripts as an event page, where importScripts does not exist. That is a
      # ReferenceError on the first line that runs, so the extension installed,
      # appeared in the list, and did nothing at all in Firefox. Both a syntax
      # check and a locale check pass on it happily.
      #
      # -W treats warnings as failures. The one warning that cannot be removed
      # from a single cross-browser manifest is the service-worker notice
      # itself, so it is filtered out by name rather than by turning the whole
      # gate advisory - a linter nobody has to obey is a linter nobody reads.
      - name: web-ext lint
        run: |
          cd extension/src
          out=$(npx --yes web-ext lint --self-hosted --output=json 2>/dev/null || true)
          printf '%s' "$out" | node -e '
            let s = ""; process.stdin.on("data", c => s += c).on("end", () => {
              let r; try { r = JSON.parse(s); } catch { console.error("web-ext lint produced no JSON"); process.exit(1); }
              const skip = new Set(["BACKGROUND_SERVICE_WORKER_IGNORED"]);
              const bad = [...(r.errors ?? []), ...(r.warnings ?? [])].filter(m => !skip.has(m.code));
              for (const m of bad) console.error(`${m.code}: ${m.message} (${m.file ?? "manifest.json"})`);
              if (bad.length) { console.error(`${bad.length} web-ext finding(s)`); process.exit(1); }
              console.log("web-ext lint clean");
            });
          '

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # Same reasoning as the web job's own type check: every locale is typed
      # as Dict derived from English, so this is what catches a missing key.
      # No native build here - that needs an Android SDK and takes minutes;
      # this catches the class of mistake that actually happens.
      - name: Type check
        run: npx tsc --noEmit

      # The gate for the defect class that cost four rounds of "drag and drop
      # does not work": a FlatList redraws a cell only when `data` changes by
      # reference or `extraData` does, so a row that closes over component state
      # silently stops updating. It usually works by accident, because most
      # `data` props are rebuilt every render - and it breaks the moment
      # somebody makes that reference stable, which is normally an optimisation.
      - name: FlatList extraData
        run: node check-extradata.mjs

  # The desktop bundle's own module, compiled and vetted but not packaged.
  #
  # It exists because desktop/ was a blind spot: desktop.yml only runs on a
  # `v*.*.*` tag or by hand, this repo has no such tag yet, and nothing else
  # touched the module - so between 2026-08-09 and 2026-08-27 it went through
  # three waves, the relay rewrite and the frame-encryption change without
  # once being compiled. It `replace`s the main module, so any signature change
  # there can break it, and the first sign would have been the very first
  # release failing.
  #
  # Compile-only on purpose. A real Wails build needs GTK/WebKit system
  # packages and produces an artifact nobody consumes on a normal push; what
  # actually goes wrong here is a type error against the main module, and
  # `go build` catches that in seconds. desktop.yml still owns real packaging.
  #
  # webkit2_41 matches desktop.yml's own build tag: Wails binds
  # webkit2gtk-4.0 by default and Ubuntu 24.04 only ships 4.1, which is the
  # difference between this job compiling and it failing on the linker.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # Wails links against WebKitGTK even for a plain `go build`, so the
      # headers have to be present or the compile fails on a missing pkg-config
      # entry rather than on anything in this repo.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Build
        run: go build -tags webkit2_41 ./...
