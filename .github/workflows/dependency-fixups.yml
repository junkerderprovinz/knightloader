name: Dependency fixups

# A Renovate branch leaves two files behind that CI then fails on: web/dist,
# which is committed and has to match the sources, and desktop/go.mod, which
# follows the main module through its replace directive. This commits both back
# to the branch, so the PR can merge by itself.
#
# The push uses RENOVATE_DIST_TOKEN, a fine-grained token with Contents: Read
# and write on this repository only. A push made with GITHUB_TOKEN would not
# start CI on the new commit.
#
# npm ci runs the updated packages' install scripts, and a process one of them
# leaves behind could read the environment of any later step on the same
# runner. So the build runs in a job that never sees the token, and the push
# runs on a fresh runner that never runs npm.

on:
  push:
    branches: ["renovate/**"]
    # web/dist and desktop/ are listed for a rebase: Renovate drops the commit
    # made here and leaves the manifests as they were.
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "web/dist/**"
      - "go.mod"
      - "go.sum"
      - "desktop/go.mod"
      - "desktop/go.sum"

permissions:
  contents: read

concurrency:
  group: dependency-fixups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # The push below starts this workflow again, with nothing left to do.
    # renovate.json lists the same address under gitIgnoredAuthors, or Renovate
    # would stop merging the branch once this has committed to it.
    if: github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changed.outputs.web }}
      go: ${{ steps.changed.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch updates
        id: changed
        run: |
          base=$(git merge-base origin/main HEAD)
          if ! git diff --quiet "$base" HEAD -- web/package.json web/package-lock.json; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet "$base" HEAD -- go.mod go.sum desktop/go.mod desktop/go.sum; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web/dist
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  push:
    needs: [changes, build]
    # build is skipped when only Go moved, and that is fine; a failed build is not.
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Take the new web/dist
        if: needs.changes.outputs.web == 'true'
        run: rm -rf web/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.changes.outputs.web == 'true'
        with:
          name: web-dist
          path: web/dist

      - name: Commit web/dist
        if: needs.changes.outputs.web == 'true'
        run: |
          git add -A web/dist
          git diff --cached --quiet || git commit -m "Rebuild web/dist"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Tidy the desktop module
        if: needs.changes.outputs.go == 'true'
        working-directory: desktop
        run: |
          go mod tidy
          git add go.mod go.sum
          git diff --cached --quiet || git commit -m "Tidy desktop/go.mod"

      # No force: if Renovate has pushed in the meantime, that push starts a
      # fresh run.
      - name: Push
        env:
          TOKEN: ${{ secrets.RENOVATE_DIST_TOKEN }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
