name: Dependency fixups

# A Renovate branch leaves two files behind that CI then fails on: web/dist,
# which is committed and has to match the sources, and desktop/go.mod, which
# follows the main module through its replace directive. This commits both back
# to the branch, so the PR can merge by itself.
#
# The push uses RENOVATE_DIST_TOKEN, a fine-grained token with Contents: Read
# and write on this repository only. A push made with GITHUB_TOKEN would not
# start CI on the new commit.

on:
  push:
    branches: ["renovate/**"]
    # web/dist and desktop/ are listed for a rebase: Renovate drops the commit
    # made here and leaves the manifests as they were.
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "web/dist/**"
      - "go.mod"
      - "go.sum"
      - "desktop/go.mod"
      - "desktop/go.sum"

permissions:
  contents: read

concurrency:
  group: dependency-fixups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixup:
    # The push below starts this workflow again, with nothing left to do.
    # renovate.json lists the same address under gitIgnoredAuthors, or Renovate
    # would stop merging the branch once this has committed to it.
    if: github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # npm ci runs the updated packages' install scripts, which must not find
      # a token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What the branch updates
        id: changed
        run: |
          base=$(git merge-base origin/main HEAD)
          if ! git diff --quiet "$base" HEAD -- web/package.json web/package-lock.json; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet "$base" HEAD -- go.mod go.sum desktop/go.mod desktop/go.sum; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.changed.outputs.web == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild web/dist
        if: steps.changed.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
          git add dist
          git diff --cached --quiet || git commit -m "Rebuild web/dist"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.changed.outputs.go == 'true'
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Tidy the desktop module
        if: steps.changed.outputs.go == 'true'
        working-directory: desktop
        run: |
          go mod tidy
          git add go.mod go.sum
          git diff --cached --quiet || git commit -m "Tidy desktop/go.mod"

      # No force: if Renovate has pushed in the meantime, that push starts a
      # fresh run. Hooks are off because an install script could have left one.
      - name: Push
        env:
          TOKEN: ${{ secrets.RENOVATE_DIST_TOKEN }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          git -c core.hooksPath=/dev/null push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
