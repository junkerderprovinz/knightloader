name: Firefox Add-ons

# Sends the extension of a released version to addons.mozilla.org. Firefox
# installs only add-ons Mozilla has signed, and the listed channel signs a
# version once it passes review, so this does not wait for it.
#
# Run by hand on the release's tag rather than from release.yml: every release
# raises the extension's number with the rest, and Mozilla reviews each version
# it is sent, also one whose extension did not change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # AMO takes each number once, so only a version that was released goes
      # there. release.yml has held the manifest to the tag.
      - name: This is a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::run this on a release tag such as v1.4.0, not on $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Is this version for Firefox Add-ons
        id: amo
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node .github/scripts/amo-listed.mjs

      - name: Submit it to Firefox Add-ons
        if: steps.amo.outputs.submit == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@8 sign --channel=listed --approval-timeout=0 --source-dir extension/src
