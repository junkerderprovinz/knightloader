name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Builds both images from a branch and pushes neither, so an image change can
  # be tried before a tag depends on it. Nothing is released and nothing
  # reaches a registry.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The notes are written by hand and live in the repo. Publishing them from
      # a file rather than generating them keeps the release readable: a list of
      # commit subjects says what was touched, not what changed for the user.
      - name: Locate the notes for this tag
        id: notes
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -s "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "No notes at $file; falling back to generated ones." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # The title is the version alone: the repository name is already above it.
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}

  # The self-hostable relay (Dockerfile.relay, cmd/knightloader-relay).
  #
  # It existed as a Dockerfile nothing ever built, which made the escape hatch
  # the privacy document points at - "run your own relay" - something a person
  # could only take by cloning the repository and building it themselves. The
  # settings page now offers the address field and a copyable run command, and
  # a run command naming an image nobody publishes is worse than no offer at
  # all.
  #
  # Its own image rather than a mode of the main one, for the reasons
  # Dockerfile.relay opens with: no yt-dlp, no ffmpeg, no JRE, and no state
  # beyond the current connection list.
  #
  # Pushed from a tag only, like the release above it. Nothing reaches a public
  # registry until a tag is cut deliberately; a dispatched run builds and
  # stops there.
  relay-image:
    name: Relay image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Is the tag being built the newest release in this repository?
      #
      # checkout fetches no tags, so they are fetched here rather than assumed.
      # The comparison is done with `sort -V`, which orders versions instead of
      # strings, so that v1.10.0 counts as newer than v1.9.0.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-relay
          # `latest` means "the newest released version", and nothing else.
          #
          # It carried no condition at all, so every build of this job moved it.
          # The two conditions guard two opposite accidents. Requiring a tag
          # build stops unreleased code from reaching everyone who pulls
          # `latest` before there are release notes to read. Requiring that tag
          # to be the newest one stops a re-cut of an older version from
          # dragging `latest` backwards onto it, which is what a bare tag gate
          # on its own would still allow.
          #
          # There is no `edge` counterpart here because this workflow is
          # tag-triggered only: the tip of the default branch never builds or
          # pushes the relay image.
          #
          # Still sharp on purpose: {{major}} and {{major}}.{{minor}} below are
          # moved by whichever tag built last, so re-cutting an old version
          # drags them back with it. That is correct for a normal forward
          # release and wrong only while backporting, which is rare enough to
          # sort out by hand.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # KnightLoader itself (Dockerfile), for the README's Docker button and for
  # anybody who wants the container without building it.
  #
  # Same rules as the relay image above, and for the same reasons: pushed from a
  # tag only, `latest` moved only by the newest release tag, and a dispatched
  # run builds both architectures and pushes nothing.
  #
  # COMMIT is passed in because .dockerignore keeps .git out of the build
  # context, so the toolchain inside the image has no repository to read (see
  # the Dockerfile). Without it GET /api/health answers an empty commit.
  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
          provenance: true
          sbom: true
