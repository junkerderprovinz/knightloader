name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The notes are written by hand and live in the repo. Publishing them from
      # a file rather than generating them keeps the release readable: a list of
      # commit subjects says what was touched, not what changed for the user.
      - name: Locate the notes for this tag
        id: notes
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -s "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "No notes at $file; falling back to generated ones." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # The title is the version alone: the repository name is already above it.
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}

  # The self-hostable relay (Dockerfile.relay, cmd/knightloader-relay).
  #
  # It existed as a Dockerfile nothing ever built, which made the escape hatch
  # the privacy document points at - "run your own relay" - something a person
  # could only take by cloning the repository and building it themselves. The
  # settings page now offers the address field and a copyable run command, and
  # a run command naming an image nobody publishes is worse than no offer at
  # all.
  #
  # Its own image rather than a mode of the main one, for the reasons
  # Dockerfile.relay opens with: no yt-dlp, no ffmpeg, no JRE, and no state
  # beyond the current connection list.
  #
  # Tag-triggered only, like the release above it. Nothing reaches a public
  # registry until a tag is cut deliberately.
  relay-image:
    name: Relay image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
