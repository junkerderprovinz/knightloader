name: Release

# The release is created last, with the desktop zips and checksums.txt in one
# command (.github/scripts/publish-release.sh), because it counts as latest the
# moment it is published and the README buttons and the in-app update read
# /releases/latest/download/<name>. A failed build leaves no release;
# re-running the failed jobs finishes it.
#
# The images build alongside, and their `latest` moves only once the release is
# out, by the same rule the release uses.
on:
  push:
    tags:
      - "v*.*.*"
  # A dispatched run builds and packages everything but pushes and publishes
  # nothing, so the chain can be tried before a tag depends on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Release notes are written by hand; a tag without them stops here, before
  # the long builds.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Notes exist for this tag
        if: github.ref_type == 'tag'
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file - write them before tagging."
            exit 1
          fi

  desktop:
    needs: notes
    uses: ./.github/workflows/desktop.yml

  # The release also waits for the images, so it never exists without them.
  publish:
    needs: [desktop, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      # Decided by publish-release.sh, so image-latest does not decide it again.
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pattern skips the build records the images job leaves in the run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: knightloader-*
          path: bundles

      # Each zip goes out twice: named for the tag, which internal/update asks
      # for, and without a version for the README buttons, since
      # /releases/latest/download/ takes only an exact name. A dispatched run
      # from a branch like fix/x has a slash in its ref name, hence the
      # substitution.
      - name: Package
        run: |
          set -eu
          v="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          for d in bundles/knightloader-*; do
            [ -d "$d" ] || continue
            slug="${d#bundles/knightloader-}"
            cp "$d/knightloader-${slug}.zip" "dist/knightloader-${v}-${slug}.zip"
            cp "$d/knightloader-${slug}.zip" "dist/knightloader-${slug}.zip"
          done
          ls -lh dist

      # internal/update verifies the downloaded zip against this file. Run
      # inside dist/ so the entries are bare file names, which is what both
      # internal/update and a manual `sha256sum -c` expect.
      - name: Checksums
        run: |
          set -eu
          (cd dist && sha256sum *.zip > checksums.txt)
          cat dist/checksums.txt

      # Only from a pushed tag. checksums.txt is named explicitly rather than
      # widening the glob to dist/*.
      - name: Publish
        id: publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh dist/*.zip dist/checksums.txt

  # The KnightLoader image and the self-hostable relay image, which the
  # settings page's run command for a private relay points at. Only a pushed
  # tag pushes, and only the exact version; the moving tags wait for the
  # release in image-latest.
  images:
    needs: notes
    name: ${{ matrix.name }} image (amd64 + arm64)
    runs-on: ubuntu-latest
    # The main image compiles the whole server for arm64 under QEMU.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Container
            file: Dockerfile
            image: ghcr.io/junkerderprovinz/knightloader
          - name: Relay
            file: Dockerfile.relay
            image: ghcr.io/junkerderprovinz/knightloader-relay
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          # The default latest=auto would tag latest before the release exists.
          flavor: latest=false
          # `1.1` and `1` move with latest in image-latest.
          tags: |
            type=semver,pattern={{version}}

      # .dockerignore keeps .git out of the context, so the commit is passed in.
      # The relay ignores it.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  # `latest` is the newest released version. It moves only when
  # publish-release.sh marked this release latest, so the badge, the download
  # buttons and `docker pull ...:latest` name the same version. imagetools
  # copies the manifest without rebuilding.
  image-latest:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/junkerderprovinz/knightloader
          - ghcr.io/junkerderprovinz/knightloader-relay
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the floating tags to this release
        env:
          IMAGE: ${{ matrix.image }}
          LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          set -eu
          # An empty answer fails rather than skipping, or the image tags would
          # silently lag behind the release badge.
          case "$LATEST" in
            true) ;;
            false) echo "the release is not the newest one, so the tags stay where they are"; exit 0 ;;
            *) echo "::error::publish did not say whether $GITHUB_REF_NAME is the latest release, so the image tags are not moved blindly."; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          # metadata-action derived the pushed tag its own way, so check it.
          docker buildx imagetools inspect "${IMAGE}:${version}" > /dev/null
          docker buildx imagetools create             --tag "${IMAGE}:latest"             --tag "${IMAGE}:${version%.*}"             --tag "${IMAGE}:${version%%.*}"             "${IMAGE}:${version}"
          echo "${IMAGE}: latest, ${version%.*} and ${version%%.*} are ${version}"
