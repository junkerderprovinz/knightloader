name: Release

# THE RELEASE COMES LAST. The README's desktop buttons point at
# /releases/latest/download/<name>, and a release is "latest" from the moment it
# is published. It used to be published straight away while desktop.yml
# attached the zips twenty minutes and more later, so every release left the
# buttons, and the in-app update check, facing a release with nothing on it
# (measured on v1.1.5: 404). Now this workflow runs the desktop build and
# creates the release only when it is done, with the zips and checksums.txt in
# one command (.github/scripts/publish-release.sh). A build that fails leaves no
# release at all; re-running the failed jobs finishes it.
#
# The images build beside the desktop bundles, and `latest` on them moves only
# once the release is out, by the same rule the release uses for "Latest".
on:
  push:
    tags:
      - "v*.*.*"
  # Builds everything, packages the zips, and pushes and publishes nothing, so
  # a change to this chain or to an image can be tried before a tag depends on
  # it. A run dispatched on a tag ref is such a test too.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The notes are written by hand and live in the repo. Publishing them from a
  # file rather than generating them keeps the release readable: a list of
  # commit subjects says what was touched, not what changed for the user. So a
  # tag without notes stops here, before half an hour of builds, rather than
  # falling back to a generated list.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Notes exist for this tag
        if: github.ref_type == 'tag'
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file - write them before tagging."
            exit 1
          fi

  desktop:
    needs: notes
    uses: ./.github/workflows/desktop.yml

  # The images are part of what a release offers, so it waits for them as it
  # waits for the bundles. They take longer than the desktop builds, and a
  # release that exists while its image does not is the same half-finished
  # release the draft used to be.
  publish:
    needs: [desktop, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      # Decided by publish-release.sh, so image-latest below does not decide it
      # a second time.
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The desktop zips only, each in a folder named after its artifact. The
      # images job leaves build records of its own in the same run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: knightloader-*
          path: bundles

      # One archive per platform, named for the tag, so a download sitting in
      # somebody's folder still says which version it is. desktop.yml zipped it
      # on the runner that built it, which is what keeps the execute bits.
      #
      # And a second copy of each under a name with no version in it, for the
      # README's download buttons. GitHub serves the newest release's asset from
      # /releases/latest/download/<exact name>, with no pattern and no wildcard,
      # so a name carrying the version could only ever be linked for the one
      # release it belongs to. internal/update keeps asking for the versioned
      # name, which stays.
      #
      # A dispatched run from a branch such as fix/x has a slash in its ref
      # name, which a file name cannot hold.
      - name: Package
        run: |
          set -eu
          v="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          for d in bundles/knightloader-*; do
            [ -d "$d" ] || continue
            slug="${d#bundles/knightloader-}"
            cp "$d/knightloader-${slug}.zip" "dist/knightloader-${v}-${slug}.zip"
            cp "$d/knightloader-${slug}.zip" "dist/knightloader-${slug}.zip"
          done
          ls -lh dist

      # sha256 alongside each zip so a download can be checked against what
      # this pipeline actually produced, not just trusted because it arrived
      # over TLS from a real GitHub asset host - internal/update's Download
      # (see that package's own doc comment) fetches this file next to the
      # platform zip and refuses to hand the download to Apply if the digest
      # does not match. Run from inside dist/ so the entries in the file are
      # bare filenames with no "dist/" prefix: that is what lets Download
      # match an entry by the same asset name it already downloaded under,
      # and what lets a human run `sha256sum -c checksums.txt` by hand from
      # inside a folder holding just the downloaded zip and this file. The copies
      # without a version are listed too, so a zip taken from a README button
      # can be checked the same way.
      - name: Checksums
        run: |
          set -eu
          (cd dist && sha256sum *.zip > checksums.txt)
          cat dist/checksums.txt

      # Only from a pushed tag; a dispatched run stops after packaging. The
      # checks before publishing, and the rule for "Latest", are in the script.
      #
      # dist/checksums.txt is named alongside the zip glob explicitly rather than
      # widened into dist/*, which would also sweep up anything else that ever
      # lands in dist/.
      - name: Publish
        id: publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh dist/*.zip dist/checksums.txt

  # The two images, one job per image.
  #
  # KnightLoader itself (Dockerfile): for the README's Docker button and for
  # anybody who wants the container without building it.
  #
  # The self-hostable relay (Dockerfile.relay, cmd/knightloader-relay). It
  # existed as a Dockerfile nothing ever built, which made the escape hatch the
  # privacy document points at - "run your own relay" - something a person
  # could only take by cloning the repository and building it themselves. The
  # settings page now offers the address field and a copyable run command, and
  # a run command naming an image nobody publishes is worse than no offer at
  # all. Its own image rather than a mode of the main one, for the reasons
  # Dockerfile.relay opens with: no yt-dlp, no ffmpeg, no JRE, and no state
  # beyond the current connection list.
  #
  # Pushed from a pushed tag only, and only after the notes check, like the
  # release. A dispatched run builds both architectures and stops there. The
  # version tags go up with the build; `latest` waits for the release, see
  # image-latest below.
  images:
    needs: notes
    name: ${{ matrix.name }} image (amd64 + arm64)
    runs-on: ubuntu-latest
    # The main image compiles the whole server for arm64 under QEMU.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Container
            file: Dockerfile
            image: ghcr.io/junkerderprovinz/knightloader
          - name: Relay
            file: Dockerfile.relay
            image: ghcr.io/junkerderprovinz/knightloader-relay
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` here: see image-latest.
      #
      # Still sharp on purpose: {{major}} and {{major}}.{{minor}} below are
      # moved by whichever tag built last, so re-cutting an old version drags
      # them back with it. That is correct for a normal forward release and
      # wrong only while backporting, which is rare enough to sort out by hand.
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          # WITHOUT THIS the action adds `latest` on its own: its default is
          # latest=auto, which tags every semver build that is not a
          # pre-release. That is what it did on v1.1.6, so the build moved
          # `latest` half an hour before the release existed, and image-latest
          # below only corrected it afterwards.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # COMMIT is passed because .dockerignore keeps .git out of the build
      # context, so the toolchain inside the image has no repository to read
      # (see the Dockerfile); without it GET /api/health answers an empty
      # commit. The relay declares no COMMIT and ignores it.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  # `latest` means "the newest released version", and nothing else.
  #
  # It carried no condition at all once, so every build moved it. Now it moves
  # only once this tag's release is published and carries the "Latest" badge,
  # and that answer is the one publish-release.sh already gave rather than a
  # second rule that could drift from it: badge, download buttons and
  # `docker pull ...:latest` then always name the same version. A version whose
  # release never comes out cannot take it, and re-cutting an older one cannot
  # drag it back. Pointing `latest` at the version just pushed copies the
  # manifest in the registry; nothing is rebuilt, and imagetools needs no
  # builder for it.
  image-latest:
    needs: [images, publish]
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/junkerderprovinz/knightloader
          - ghcr.io/junkerderprovinz/knightloader-relay
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to this release
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_REF_NAME#v}"
          echo "${IMAGE}:latest is ${GITHUB_REF_NAME#v}"
