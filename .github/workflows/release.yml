name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Builds both images from a branch and pushes neither, so an image change can
  # be tried before a tag depends on it. Nothing is released and nothing
  # reaches a registry.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The notes are written by hand and live in the repo. Publishing them from
      # a file rather than generating them keeps the release readable: a list of
      # commit subjects says what was touched, not what changed for the user.
      #
      # AS A DRAFT. desktop.yml publishes it once the zips are attached, so the
      # README's download buttons keep serving the previous release meanwhile;
      # .github/scripts/publish-when-complete.sh explains the rest. Created with
      # gh rather than action-gh-release, which looks a release up by its tag
      # and does not see a draft there: a re-run would add a second draft
      # instead of finding the first.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"
            exit 0
          fi
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -s "$file" ]; then
            set -- --notes-file "$file"
          else
            echo "No notes at $file; falling back to generated ones." >&2
            set -- --generate-notes
          fi
          # The title is the version alone: the repository name is already above it.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" "$@"

  # The two images, one job per image.
  #
  # KnightLoader itself (Dockerfile): for the README's Docker button and for
  # anybody who wants the container without building it.
  #
  # The self-hostable relay (Dockerfile.relay, cmd/knightloader-relay). It
  # existed as a Dockerfile nothing ever built, which made the escape hatch the
  # privacy document points at - "run your own relay" - something a person
  # could only take by cloning the repository and building it themselves. The
  # settings page now offers the address field and a copyable run command, and
  # a run command naming an image nobody publishes is worse than no offer at
  # all. Its own image rather than a mode of the main one, for the reasons
  # Dockerfile.relay opens with: no yt-dlp, no ffmpeg, no JRE, and no state
  # beyond the current connection list.
  #
  # Pushed from a pushed tag only, like the release above. Nothing reaches a
  # public registry until a tag is cut deliberately; a dispatched run builds
  # both architectures and stops there, on a tag ref as much as on a branch.
  images:
    name: ${{ matrix.name }} image (amd64 + arm64)
    runs-on: ubuntu-latest
    # The main image compiles the whole server for arm64 under QEMU.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Container
            file: Dockerfile
            image: ghcr.io/junkerderprovinz/knightloader
          - name: Relay
            file: Dockerfile.relay
            image: ghcr.io/junkerderprovinz/knightloader-relay
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` here: see the step after the build.
      #
      # Still sharp on purpose: {{major}} and {{major}}.{{minor}} below are
      # moved by whichever tag built last, so re-cutting an old version drags
      # them back with it. That is correct for a normal forward release and
      # wrong only while backporting, which is rare enough to sort out by hand.
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # COMMIT is passed because .dockerignore keeps .git out of the build
      # context, so the toolchain inside the image has no repository to read
      # (see the Dockerfile); without it GET /api/health answers an empty
      # commit. The relay declares no COMMIT and ignores it.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      # `latest` means "the newest released version", and nothing else.
      #
      # It carried no condition at all once, so every build moved it. Two
      # conditions guard two opposite accidents. Only a pushed tag moves it,
      # which stops unreleased code from reaching everyone who pulls `latest`
      # before there are release notes to read. And only the newest tag moves
      # it, which stops a re-cut of an older version from dragging `latest`
      # backwards onto it.
      #
      # AFTER the build rather than before, and from tags fetched now. A tag
      # list read at checkout cannot know about a tag pushed during a
      # forty-minute arm64 build, and then the older build, finishing last,
      # would move `latest` back onto itself. Pointing `latest` at the version
      # just pushed copies the manifest in the registry; nothing is rebuilt.
      #
      # checkout fetches no tags, so they are fetched here rather than assumed,
      # and ordered with `sort -V`, so that v1.10.0 counts as newer than v1.9.0.
      # Only plain vX.Y.Z tags count.
      - name: Move latest if this is the newest release tag
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v*' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" != "${GITHUB_REF_NAME}" ]; then
            echo "-> latest stays where it is"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_REF_NAME#v}"
          echo "-> ${IMAGE}:latest is ${GITHUB_REF_NAME#v}"
