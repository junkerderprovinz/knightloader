name: Release (Android app)

# The app installs and upgrades separately from the server, so it has its own
# tags: "mobile/vX.Y.Z" here, "extension/vX.Y.Z" for the extension and a bare
# "vX.Y.Z" for KnightLoader. A "*" in a ref filter does not cross a "/", so
# release.yml never sees these tags.
on:
  push:
    tags:
      - "mobile/v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The versionCode check compares against the previous mobile tag, and
          # a shallow checkout has no tags to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 17 is what the Gradle plugin of this Expo SDK expects.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: npm ci

      # Checked before anything expensive runs. A branch ref carries no
      # version to compare.
      - name: Tag matches app.json
        id: version
        if: github.ref_type == 'tag'
        run: |
          tagged="${GITHUB_REF_NAME#mobile/v}"
          echo "bare=$tagged" >> "$GITHUB_OUTPUT"
          declared=$(node -p "require('./app.json').expo.version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag says $tagged, app.json says $declared - bump app.json before tagging."
            exit 1
          fi
          # Android orders upgrades by versionCode, and the usual mistake is
          # forgetting to raise it, so it is compared with the previous tag.
          code=$(node -p "require('./app.json').expo.android.versionCode || 0")
          if [ "$code" = "0" ]; then
            echo "::error::app.json has no expo.android.versionCode."
            exit 1
          fi
          prev=$(git tag -l 'mobile/v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$prev" ]; then
            prevCode=$(git show "$prev:mobile/app.json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).expo.android.versionCode||0))")
            if [ "$code" -le "$prevCode" ]; then
              echo "::error::versionCode $code is not above $prev's $prevCode - a phone cannot tell the two builds apart."
              exit 1
            fi
          fi
          echo "version $declared (versionCode $code)"

      # action-gh-release publishes an empty release when body_path cannot be
      # read, with only a warning in the log.
      - name: Notes exist for this tag
        if: github.ref_type == 'tag'
        working-directory: ${{ github.workspace }}
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file - write them before tagging."
            exit 1
          fi
          wc -l "$file"

      # Android identifies an app by package name and signing certificate, so
      # the key can never change without an uninstall. expo prebuild signs
      # release builds with the public debug key unless told otherwise, and
      # anybody could publish an update to such an APK. A dispatched build only
      # checks that the app compiles and needs no key.
      - name: Signing key is available
        if: github.ref_type == 'tag'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing - a release APK must not be signed with the public Android debug key. Create a keystore once (keytool -genkeypair -v -keystore knightloader.jks -alias knightloader -keyalg RSA -keysize 4096 -validity 10000), then: gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -w0 knightloader.jks) and set the other three. Keep the .jks file itself out of this repository, and keep a backup of it: losing it means no future version can ever update an installed copy."
            exit 1
          fi

      # android/ is generated, not committed. The signing config comes from
      # mobile/plugins/withReleaseSigning.js.
      - name: Generate the native project
        run: npx expo prebuild --platform android --clean

      # Outside android/, which prebuild --clean deletes, and outside the
      # workspace.
      - name: Unpack the keystore
        if: github.ref_type == 'tag'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          KL_ANDROID_KEYSTORE: ${{ github.ref_type == 'tag' && format('{0}/release.jks', runner.temp) || '' }}
          KL_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name it after the version
        id: apk
        run: |
          v="${GITHUB_REF_NAME#mobile/v}"
          out="KnightLoader-$v.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=mobile/$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      # A broken gradle wiring or a wrong alias still ends in a green,
      # debug-signed build, so the certificate in the finished APK is checked.
      - name: The APK is signed with our own key
        if: github.ref_type == 'tag'
        # The published path is relative to the workspace, not to mobile/.
        working-directory: ${{ github.workspace }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::no apksigner in $ANDROID_HOME/build-tools - cannot verify what signed this APK, and publishing it unverified is the thing this step exists to prevent."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}")
          echo "$certs"
          if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
            echo "::error::this APK is signed with the public Android debug key. Every installed copy would be updatable by anyone, and the key cannot be changed later without an uninstall. Check the ANDROID_KEYSTORE_* secrets and mobile/plugins/withReleaseSigning.js."
            exit 1
          fi

      # Kept as an artifact before the release upload, which has timed out on
      # this file, so a failed upload can be retried by hand without another
      # signed build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref_type == 'tag'
        with:
          name: knightloader-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        # A dispatched run only checks that the app builds; from a branch it
        # would find no notes and publish an empty release.
        if: github.ref_type == 'tag'
        with:
          # Three products share the releases list, so the title names which
          # one this is. GitHub shows the full tag beside it.
          name: App ${{ steps.version.outputs.bare }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          # The Latest badge belongs to the main vX.Y.Z release, and GitHub
          # would otherwise give it to whatever was published last.
          make_latest: false
          files: ${{ steps.apk.outputs.path }}

      # For the README download button; see .github/scripts/publish-newest.sh.
      - name: The newest app under a fixed name
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: bash .github/scripts/publish-newest.sh mobile "$APK" knightloader-android.apk App
