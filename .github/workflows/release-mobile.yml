name: Release (Android app)

# The app is versioned and released on its own, separately from the server.
#
# It is a separately installed artifact with its own upgrade story - an APK on a
# phone does not change when a container is pulled - so tying it to the server's
# version would mean either bumping it for changes it does not contain, or not
# bumping it for changes it does. The tag namespace keeps the two apart:
# "mobile/vX.Y.Z" here, "extension/vX.Y.Z" for the browser extension, and a
# bare "vX.Y.Z" for KnightLoader itself.
#
# The bare pattern in release.yml does NOT match these: a "*" in a GitHub ref
# filter does not cross a "/", so "mobile/v1.0.0" is invisible to it and this
# workflow is invisible to a plain "v1.0.0".
on:
  push:
    tags:
      - "mobile/v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The versionCode check compares against the previous mobile tag, and
          # a shallow checkout has no tags to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The APK's own Java, not the app's. Pinned to 17 because that is what
      # the Gradle plugin this Expo SDK generates expects.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: npm ci

      # The version in the tag and the version in app.json have to agree, or
      # the release says one thing and the file inside it says another. Checked
      # before anything expensive runs, and only on a tag: dispatched from a
      # branch there is no version in the ref to compare, and the check would
      # otherwise fail with advice about a problem that does not exist.
      - name: Tag matches app.json
        id: version
        if: github.ref_type == 'tag'
        run: |
          tagged="${GITHUB_REF_NAME#mobile/v}"
          echo "bare=$tagged" >> "$GITHUB_OUTPUT"
          declared=$(node -p "require('./app.json').expo.version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag says $tagged, app.json says $declared - bump app.json before tagging."
            exit 1
          fi
          # versionCode is not cosmetic: Android decides upgrade order by it, so
          # two builds sharing one are indistinguishable to a phone. Compared
          # against the previous mobile tag rather than merely required to
          # exist, because "present but never incremented" is the failure that
          # actually happens.
          code=$(node -p "require('./app.json').expo.android.versionCode || 0")
          if [ "$code" = "0" ]; then
            echo "::error::app.json has no expo.android.versionCode."
            exit 1
          fi
          prev=$(git tag -l 'mobile/v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$prev" ]; then
            prevCode=$(git show "$prev:mobile/app.json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).expo.android.versionCode||0))")
            if [ "$code" -le "$prevCode" ]; then
              echo "::error::versionCode $code is not above $prev's $prevCode - a phone cannot tell the two builds apart."
              exit 1
            fi
          fi
          echo "version $declared (versionCode $code)"

      # action-gh-release swallows an unreadable body_path and publishes an
      # EMPTY release, with only a warning in the log. After a build this long
      # that is the worst of both worlds: quieter than a failure and just as
      # wrong. release.yml probes for the file and falls back to generated
      # notes; here a release without hand-written notes is a mistake, so it
      # stops instead.
      - name: Notes exist for this tag
        if: github.ref_type == 'tag'
        # From the workspace root, not from mobile/: this job's run steps
        # default to mobile/, and the notes live at the top of the repository.
        working-directory: ${{ github.workspace }}
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file - write them before tagging."
            exit 1
          fi
          wc -l "$file"

      # An Android app is identified by (package name, signing certificate), so
      # the key can never be swapped later without turning the next version
      # into a DIFFERENT app that every installed copy has to be uninstalled
      # for. That makes an unsigned-for-real release the one mistake here with
      # no cheap correction, which is why this stops the run rather than
      # warning: expo prebuild's generated release buildType signs with the
      # public `androiddebugkey` (password `android`) unless told otherwise,
      # and a debug-signed APK is one anybody can publish an update to.
      #
      # Only on a tag. A dispatched build from a branch is for checking that
      # the thing compiles, and demanding release credentials for that would
      # make the cheap check the expensive one.
      - name: Signing key is available
        if: github.ref_type == 'tag'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing - a release APK must not be signed with the public Android debug key. Create a keystore once (keytool -genkeypair -v -keystore knightloader.jks -alias knightloader -keyalg RSA -keysize 4096 -validity 10000), then: gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -w0 knightloader.jks) and set the other three. Keep the .jks file itself out of this repository, and keep a backup of it: losing it means no future version can ever update an installed copy."
            exit 1
          fi

      # android/ is not committed - it is generated, and regenerating it is how
      # a build stays reproducible from the sources alone. The release signing
      # config comes from mobile/plugins/withReleaseSigning.js, applied here by
      # the same prebuild a laptop runs.
      - name: Generate the native project
        run: npx expo prebuild --platform android --clean

      # Written outside android/, which prebuild --clean deletes, and outside
      # the workspace copy that gets archived anywhere.
      - name: Unpack the keystore
        if: github.ref_type == 'tag'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          KL_ANDROID_KEYSTORE: ${{ github.ref_type == 'tag' && format('{0}/release.jks', runner.temp) || '' }}
          KL_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name it after the version
        id: apk
        run: |
          v="${GITHUB_REF_NAME#mobile/v}"
          out="KnightLoader-$v.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=mobile/$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      # The env var having been set is not evidence that the APK came out signed
      # with it - a typo in the gradle wiring, a plugin that silently stopped
      # matching the template, a keystore holding a different alias, each ends
      # in a debug-signed file and a green build. The certificate inside the
      # finished APK is the only thing that actually answers the question, so
      # that is what is read, and "CN=Android Debug" fails the run.
      - name: The APK is signed with our own key
        if: github.ref_type == 'tag'
        # From the workspace root: this job's run steps default to mobile/, and
        # the path the previous step published is already workspace-relative -
        # so without this the file is looked for at mobile/mobile/... and the
        # step fails on a missing file rather than on what it went to check.
        # Same shape as the notes gate above, which had the same bug.
        working-directory: ${{ github.workspace }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::no apksigner in $ANDROID_HOME/build-tools - cannot verify what signed this APK, and publishing it unverified is the thing this step exists to prevent."
            exit 1
          fi
          certs=$("$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}")
          echo "$certs"
          if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
            echo "::error::this APK is signed with the public Android debug key. Every installed copy would be updatable by anyone, and the key cannot be changed later without an uninstall. Check the ANDROID_KEYSTORE_* secrets and mobile/plugins/withReleaseSigning.js."
            exit 1
          fi

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        # A workflow_dispatch run is for checking that the app still builds. Without
        # this it would reach here with github.ref_name holding a BRANCH, look for
        # release notes under that name, find none, and publish an empty release
        # from a branch - the exact silent-empty-release failure the notes gate
        # above is written to prevent, arriving through the door that gate skips.
        if: github.ref_type == 'tag'
        with:
          # The house rule is that a release title is the bare version, because
          # the repository name already sits above it. That still holds - the
          # repository name is NOT repeated here. What is added is which of the
          # three products in this repository the release is for, because
          # "mobile/v1.0.0" next to "extension/v1.3.0" in a list tells a reader
          # nothing. The version drops its namespace: GitHub already prints the
          # full tag beside the title.
          name: App ${{ steps.version.outputs.bare }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: ${{ steps.apk.outputs.path }}
